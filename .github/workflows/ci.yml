name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The check, the cross builds and the Windows build run in the builder image
# (scripts/builder/Dockerfile, pushed by builder.yml and named here by its
# digest): the compilers and libraries are in it, and a job installs no
# system package while it runs. The Android build runs on the runner itself,
# whose SDK it uses. Build caches are written from main only and read by
# every branch and by the release.
jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml, in the image unless the file has moved on
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh

  ship:
    name: cross builds
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ship.sh
      - name: The tap passes every format through byte for byte
        run: scripts/tap_exact.sh lib/x64/libglasstap.so bin/x64/tapdump
      - name: Plugin zip
        run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/glass-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      - uses: actions/upload-artifact@v7
        with:
          name: glass-plugin
          path: dist/glass-*.zip
          if-no-files-found: error

  windows:
    if: github.ref == 'refs/heads/main'
    name: windows cross build
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ship-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glass-windows-x64
          path: bin/windows-x64
          if-no-files-found: error

  android:
    if: github.ref == 'refs/heads/main'
    name: android build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: The NDK, the build tools and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" >/dev/null
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The script finds the NDK under the runner's ANDROID_HOME itself.
      - run: scripts/ship-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glass-android
          path: dist/glass-*-android.apk
          if-no-files-found: error
