name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - name: System libraries the display and the tap link against, and aplay for the template check
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev alsa-utils
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh

  ship:
    name: cross builds
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - name: Cross compilers and the libraries the host build links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu libc6-dev-armhf-cross libc6-dev-arm64-cross libsdl2-dev libasound2-dev alsa-utils
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ship.sh
      - name: The tap passes every format through byte for byte
        run: scripts/tap_exact.sh lib/x64/libglasstap.so bin/x64/tapdump
      - name: Plugin zip
        run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glass-plugin
          path: dist/glass-*.zip
          if-no-files-found: error

  windows:
    name: windows cross build
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add x86_64-pc-windows-gnu
      - name: MinGW-w64, for the link
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ship-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: glass-windows-x64
          path: bin/windows-x64
          if-no-files-found: error

  android:
    name: android build
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: The NDK, the build tools and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" >/dev/null
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ship-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - uses: actions/upload-artifact@v7
        with:
          name: glass-android
          path: dist/glass-*-android.apk
          if-no-files-found: error
