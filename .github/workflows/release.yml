name: release

# A tag builds the release: the check, the Linux builds, the Windows build
# and the Android app side by side, then one job that signs and publishes
# it as a pre-release. Run by hand it builds everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The check, the Linux builds and the Windows build run in the builder image
# (scripts/builder/Dockerfile, named by its digest as in ci.yml) and read
# the build caches ci.yml wrote on main.
jobs:
  check:
    name: format, lints, tests, docs
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the workspace carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, the workspace is $version" >&2; exit 1; }
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          cache-bin: false
          save-if: false
      - run: scripts/check.sh

  linux:
    name: cross builds, the plugin zip, the remotes' archives
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ship
          cache-bin: false
          save-if: false
      - run: scripts/ship.sh
      - name: The tap passes every format through byte for byte
        run: scripts/tap_exact.sh lib/x64/libevotap.so bin/x64/evotap-dump bin/x64/evotap-cat
      - run: scripts/package.sh
      - name: The zip names the commit it was built from
        run: |
          unzip -p dist/glass-*.zip build.json | grep -F "\"commit\": \"$(git rev-parse --short HEAD)\""
      # The movie's decoder beside the display in every remote archive: evovpeg
      # fetched as outcast-lite is (components/evovpeg.lock, verified before
      # anything of it is packed), so a remote works out of the box with no
      # ffmpeg on the machine's path. The plugin zip is packed before this and
      # does not carry it: the player fetches its own on demand.
      - name: The movie's decoder beside the display, for the remotes
        run: |
          scripts/fetch-components.sh evovpeg
          v=$(sed -n 's/^VERSION=//p' components/evovpeg.lock)
          for arch in arm armv7 armv8 x64; do
            for p in evovpeg evovprobe; do
              install -D -m 755 "target/components/evovpeg/$arch/evovpeg-$v-$arch/bin/$p" "bin/$arch/$p"
            done
          done
      - name: Per-architecture archives of the display, the tap and the remote installer
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for arch in arm armv7 armv8 x64; do
            tar -C . --exclude="bin/$arch/outcast-lite" --transform "s,^,glass-$version-$arch/," -czf "dist/glass-$version-$arch.tar.gz" "bin/$arch" "lib/$arch" remote/README.md remote/linux
          done
          # What a remote needs is a few megabytes of its own and about
          # twelve of the decoder; anything more is the build's leavings,
          # never to be published again.
          for f in dist/glass-*-*.tar.gz; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt 40000000 ]; then
              echo "$f is $size bytes, more than a remote needs:" >&2
              tar -tzf "$f" | head -40 >&2
              exit 1
            fi
          done
      # evotap on its own: the library, the readers and the contract per
      # architecture, for the evotap repository's release (foonerd/evotap),
      # which any plugin ships from without depending on Glass.
      - name: Per-architecture archives of evotap, named by evotap's own version
        run: |
          version=$(scripts/evotap-version.sh)
          said=$(bin/x64/evotap-cat --version)
          [ "$said" = "evotap $version" ] || { echo "evotap-cat says '$said', the tree says evotap $version" >&2; exit 1; }
          said=$(bin/x64/evotap-dump --version)
          [ "$said" = "evotap $version" ] || { echo "evotap-dump says '$said', the tree says evotap $version" >&2; exit 1; }
          for arch in arm armv7 armv8 x64; do
            top="evotap-$version-$arch"
            rm -rf "dist/$top" && mkdir -p "dist/$top/lib" "dist/$top/bin"
            cp "lib/$arch/libevotap.so" "dist/$top/lib/"
            cp "bin/$arch/evotap-cat" "bin/$arch/evotap-dump" "dist/$top/bin/"
            cp evotap/README.md LICENSE "dist/$top/"
            tar -C dist -czf "dist/$top.tar.gz" "$top" && rm -rf "dist/$top"
          done
          ls -la dist/evotap-*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/glass-*.zip
            dist/glass-*-*.tar.gz
            dist/evotap-*.tar.gz
          if-no-files-found: error

  windows:
    name: windows cross build
    runs-on: ubuntu-24.04
    container: ghcr.io/foonerd/glass-builder@sha256:1d6d085cbf23ff53628402be14e87a5ffe996416894684e596956143365800da
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false
          save-if: false
      - run: scripts/ship-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: bin/windows-x64
          if-no-files-found: error

  # The Android app is signed with the project's key when the repository
  # holds it (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS);
  # without it the apk carries a throwaway key and is not published.
  android:
    name: android build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup show active-toolchain && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: The NDK, the build tools and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" >/dev/null
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          save-if: false
      - name: The Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glass-android.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/glass-android.jks"
          fi
          scripts/ship-android.sh
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no signing key in the repository: the apk is not published"
            rm -f dist/glass-*-android.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/glass-*-android.apk
          if-no-files-found: ignore

  publish:
    name: sign, publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, linux, windows, android]
    runs-on: ubuntu-24.04
    # The environment names this job to Azure: the federated credential
    # for Trusted Signing matches repo:foonerd/glass:environment:release,
    # the same for every tag.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: What the build jobs made, where the steps below look for it
        run: |
          mkdir -p dist dist-evotap bin/windows-x64
          cp artifacts/release-linux/* dist/
          # evotap's archives go to their own release, not Glass's.
          mv dist/evotap-*.tar.gz dist-evotap/
          cp artifacts/release-windows/* bin/windows-x64/
          if ls artifacts/release-android/*.apk >/dev/null 2>&1; then
            cp artifacts/release-android/*.apk dist/
          else
            echo "no signed apk from the Android build: none is published"
          fi
          ls -la dist bin/windows-x64
      # The Windows binary and the installer are signed with Azure Trusted
      # Signing when the repository holds the account (variables
      # TRUSTED_SIGNING_ENDPOINT, _ACCOUNT, _PROFILE; secrets AZURE_TENANT_ID,
      # AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID for a federated login);
      # without them the archive is published unsigned.
      - name: Azure login for Trusted Signing
        if: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the Windows binary and the installer
        if: ${{ vars.TRUSTED_SIGNING_ACCOUNT != '' }}
        run: scripts/sign-windows.sh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
      - name: The Windows archive of the display and the remote installer
        run: |
          top="glass-${GITHUB_REF_NAME#v}-windows-x64"
          rm -rf "dist/$top" && mkdir -p "dist/$top/remote"
          # The movie's decoder beside the display, as the Linux archives
          # carry it: evovpeg's Windows build, fetched and verified here.
          scripts/fetch-components.sh evovpeg
          v=$(sed -n 's/^VERSION=//p' components/evovpeg.lock)
          for p in evovpeg evovprobe; do
            install -D -m 755 "target/components/evovpeg/windows-x64/evovpeg-$v-windows-x64/bin/$p.exe" "bin/windows-x64/$p.exe"
          done
          cp -r bin/windows-x64 "dist/$top/bin"
          cp -r remote/windows remote/README.md "dist/$top/remote/"
          (cd dist && zip -qr "$top.zip" "$top") && rm -rf "dist/$top"
      # Every asset's digest in SHA256SUMS, signed with the project's
      # release key (secret RELEASE_SIGNING_KEY, the Ed25519 private key as
      # PEM) and checked against the public key the products carry
      # (keys/release-signing.pub), so no release goes out that a player
      # would refuse. Without the secret the release is published unsigned,
      # and a player installs it as it did before signing.
      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: the release is published unsigned"
            exit 0
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
          scripts/sign-release.sh dist-evotap keys/release-signing.pub
      - name: Notes from the changelog, with the sponsorship footer
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > dist/notes.md
          printf '\nShips evotap %s.\n\n' "$(scripts/evotap-version.sh)" >> dist/notes.md
          cat .github/release-footer.md >> dist/notes.md
      # Published as a pre-release: no player is offered it but one set to
      # take test releases. It is made the latest by hand once it has been
      # tried (gh release edit <tag> --prerelease=false --latest).
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          body_path: dist/notes.md
          files: |
            dist/glass-*.zip
            dist/glass-*.tar.gz
            dist/glass-*-android.apk
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
      # evotap's own release, in its repository, through a token that may
      # write there (secret EVOTAP_RELEASE_TOKEN, a token with contents
      # read and write on foonerd/evotap). evotap carries its own version
      # (scripts/evotap-version.sh), so the release is cut only when that
      # version has none yet; the guard refuses a tap changed under a
      # number already released. Without the secret the step says so and
      # Glass's release stands on its own.
      # The signed evotap set kept as an artifact as well, so a release of
      # it can be made by hand from exactly what CI signed, should the
      # token be missing at the tag.
      - uses: actions/upload-artifact@v7
        with:
          name: evotap-release
          path: |
            dist-evotap/evotap-*.tar.gz
            dist-evotap/SHA256SUMS
            dist-evotap/SHA256SUMS.sig
          if-no-files-found: error
      - name: Publish evotap, where its version has no release yet
        env:
          EVOTAP_RELEASE_TOKEN: ${{ secrets.EVOTAP_RELEASE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(scripts/evotap-version.sh)
          glass="${GITHUB_REF_NAME#v}"
          verdict=$(scripts/evotap-guard.sh)
          if [ "$verdict" = same ]; then
            echo "evotap $version is released already and unchanged: nothing to publish"
            exit 0
          fi
          if [ -z "$EVOTAP_RELEASE_TOKEN" ]; then
            echo "no EVOTAP_RELEASE_TOKEN in this repository: evotap $version is not published; the signed set is the evotap-release artifact"
            exit 0
          fi
          {
            echo "evotap $version: the audio tap of the evo framework. One archive per architecture with the library, evotap-cat, evotap-dump and the contract; SHA256SUMS signed with the evo release key."
            printf '\n'
            echo "Built in Glass $glass at $GITHUB_SHA."
            printf '\n'
            cat evotap/release-footer.md
          } > dist-evotap/notes.md
          GH_TOKEN="$EVOTAP_RELEASE_TOKEN" gh release create "v$version" --repo foonerd/evotap --title "evotap $version" --notes-file dist-evotap/notes.md dist-evotap/evotap-*.tar.gz dist-evotap/SHA256SUMS dist-evotap/SHA256SUMS.sig
