[package]
name = "expose"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A Scene and assets become one RGBA frame"

[dependencies]
lead = { path = "../lead" }
plot = { path = "../plot" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
font8x8 = "0.3"
ab_glyph = "0.2.32"
# Paths and shapes only: the format icons carry no text and no raster
# pictures, and the text engine alone is the bulk of the crate.
resvg = { version = "0.48.1", default-features = false }
# The analyser's box: anti-aliased shapes, gradients and alpha.
tiny-skia = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[lints]
workspace = true
