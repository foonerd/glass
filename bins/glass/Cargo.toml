[package]
name = "glass"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Glass on the player, including headless"

[[bin]]
name = "glass"
path = "src/main.rs"

[dependencies]
expose = { path = "../../crates/expose" }
intake = { path = "../../crates/intake" }
lead = { path = "../../crates/lead" }
pane = { path = "../../crates/pane" }
plot = { path = "../../crates/plot" }
tap = { path = "../../crates/tap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "3.4.2"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
