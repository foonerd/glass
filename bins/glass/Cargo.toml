[package]
name = "glass"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Glass on the player, including headless"

[lib]
name = "glass"
path = "src/lib.rs"

[[bin]]
name = "glass"
path = "src/main.rs"

[dependencies]
logline = { path = "../../crates/logline" }
expose = { path = "../../crates/expose" }
controls = { path = "../../crates/controls" }
intake = { path = "../../crates/intake" }
overlay = { path = "../../crates/overlay" }
lead = { path = "../../crates/lead" }
pane = { path = "../../crates/pane" }
plot = { path = "../../crates/plot" }
tap = { path = "../../crates/tap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "3.4.2"
flate2 = "1"
sha2 = "0.10"
crc32fast = "1"
ed25519-dalek = "2"
# Play here on a remote: the wire the player's sound server speaks, by its
# own client crate (the events, the segment's shape, the PCM decoded), and
# the WebSocket under it, plain ws:// behind the player's Manager.
lite-client = { git = "https://github.com/foonerd/outcast", tag = "v0.1.5" }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
