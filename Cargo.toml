[workspace]
resolver = "2"
members = [
    "crates/lead",
    "crates/intake",
    "crates/plot",
    "crates/expose",
    "crates/pane",
    "crates/tap",
    "bins/glass",
    "bins/glasstap",
    "bins/glass-remote",
    "bins/glass-serve",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "MIT"
publish = false

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
