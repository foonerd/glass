[workspace]
resolver = "2"
members = [
    "crates/logline",
    "crates/lead",
    "crates/intake",
    "crates/plot",
    "crates/expose",
    "crates/controls",
    "crates/overlay",
    "crates/page",
    "crates/pane",
    "crates/tap",
    "crates/bank",
    "bins/glass",
    "bins/glasstap",
    "bins/glass-remote",
    "bins/glass-android",
    "bins/glass-serve",
    "bins/glass-face",
]

# The browser module: one unit, linked whole, so the page loads the least.
[profile.face]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"

[workspace.package]
version = "0.9.31"
edition = "2021"
license = "MIT"
publish = false

# One set of lints for every crate; CI denies warnings.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
