<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Manager</title>
<style>
  :root {
    --bg: #1c1c1c; --panel: #262626; --panel2: #303030; --line: #404040;
    --text: #e6e6e6; --muted: #9a9a9a; --accent: #54b948; --accent2: #3f8f37;
    --warn: #e6a23c; --danger: #d64545; --info: #4a90e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 6px; transition: background .15s, border-color .15s; }
  button:hover:not(:disabled) { background: #3a3a3a; border-color: #555; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); }
  button.danger { color: #ffb3b3; border-color: #6b2a2a; }
  button.danger:hover:not(:disabled) { background: #4a1f1f; }
  button.small { padding: 5px 10px; font-size: 13px; }
  input[type=text], input[type=number], input[type=search], input[type=password], select, textarea { font: inherit; background: #1a1a1a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .header { position: sticky; top: 0; z-index: 20; background: #232323; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .header h1 { font-size: 19px; font-weight: 600; color: #fff; }
  .header .sub { color: var(--muted); font-size: 13px; }
  .header .grow { flex: 1; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 18px; white-space: nowrap; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { background: none; color: #fff; }
  .view { display: none; }
  .view.active { display: block; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar .grow { flex: 1; min-width: 200px; }
  .toolbar select { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card.active-theme { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thumb { position: relative; background: #111; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
  .thumb .badge { position: absolute; top: 8px; left: 8px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .3px; padding: 2px 8px; border-radius: 10px; background: #444; color: #ddd; text-transform: uppercase; }
  .badge.green { background: var(--accent); color: #fff; }
  .badge.blue { background: var(--info); color: #fff; }
  .badge.orange { background: var(--warn); color: #222; }
  .badge.gray { background: #3a3a3a; color: #bbb; }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .title { font-weight: 600; color: #fff; word-break: break-word; }
  .card .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .progress { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin-bottom: 12px; color: #fff; }
  .panel h3 { font-size: 14px; margin: 14px 0 8px; color: #ddd; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; }
  .form .full { grid-column: 1 / -1; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text); font-size: 15px; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent); }
  .help { color: var(--muted); font-size: 13px; }
  #face-stage { background: #000; border-radius: 8px; overflow: hidden; }
  #face-canvas { display: block; width: 100%; height: auto; image-rendering: auto; }
  #face-stage:fullscreen { display: flex; align-items: center; justify-content: center; background: #000; border-radius: 0; }
  #face-stage:fullscreen canvas { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 7px 8px; border-bottom: 1px solid #333; vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 38%; }
  table.kv tr.section td { background: var(--panel2); color: #fff; font-weight: 600; padding-top: 9px; padding-bottom: 9px; }
  table.kv td { white-space: pre-wrap; }
  .diag-list { display: flex; flex-direction: column; gap: 6px; }
  .diag-list button { text-align: left; }
  .finding { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid #333; align-items: start; white-space: pre-wrap; }
  .finding .kind { color: var(--muted); font-size: 13px; padding-top: 2px; }
  .finding.cause .kind { color: var(--warn); font-weight: 600; }
  .finding.ok { color: var(--muted); }
  pre.report { white-space: pre-wrap; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #1a1a1a; border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 380px; overflow: auto; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .item .grow { flex: 1; min-width: 160px; }
  .item .name { font-weight: 600; color: #fff; }
  .meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .meters .m { background: #111; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; }
  .meters .m img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: contain; background: #0a0a0a; }
  .meters .m div { padding: 6px 8px; font-size: 13px; color: #ddd; word-break: break-word; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 14px; }
  /* How the screen looks: the looks to choose from, a likeness of the screen (its measures in 720ths of its own height), the adjustments a section each. */
  .looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin: 12px 0 18px; }
  .look-card { padding: 0; text-align: left; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .look-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .look-card .cap { padding: 7px 9px 9px; font-size: 13.5px; color: #fff; }
  .look-card .cap small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .look-card .lp { border: 0; border-radius: 0; }
  .look-cols { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .look-side { flex: 1 1 340px; max-width: 520px; min-width: 0; }
  /* Beside the adjustments the likeness stays in view while they scroll. */
  @media (min-width: 820px) { .look-side { position: sticky; top: 84px; } }
  .look-adjust { flex: 1 1 340px; min-width: 0; }
  .lp { position: relative; container-type: size; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); background: #111 center / cover no-repeat; --u: calc(var(--s, 1) * 100cqh / 720); font-weight: 700; line-height: 1; white-space: nowrap; }
  .lp-bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--barh); display: flex; align-items: center; justify-content: space-around; }
  .lp-bar svg { height: 50%; }
  .lp-top { position: absolute; top: calc(var(--u) * 20); left: 50%; transform: translateX(-50%); }
  .lp-mid { position: absolute; left: 0; right: 0; top: var(--from); bottom: var(--barh); display: flex; align-items: center; justify-content: center; }
  .lp-plate { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 8); flex: none; }
  .lp-top, .lp-plate { padding: calc(var(--u) * 12) calc(var(--u) * 28); }
  .lp-cell { position: absolute; display: flex; }
  .cells { display: inline-grid; grid-template-columns: repeat(3, 24px); gap: 3px; vertical-align: middle; margin-right: 10px; }
  .cells button { width: 24px; height: 17px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: transparent; cursor: pointer; }
  .cells button.on { background: var(--accent2); border-color: var(--accent); }
  .cells button.anchor { box-shadow: 0 0 0 2px var(--accent); }
  .cells.align button { width: 17px; height: 13px; }
  .lp canvas[data-clock] { display: block; flex: none; }
  .lp [data-open] { cursor: pointer; }
  .lp [data-open]:hover, .lp [data-open]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 14px; font-size: 14px; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  button.acc { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #333; border-radius: 0; padding: 11px 2px; font-size: 14.5px; }
  button.acc b { font-weight: 600; color: #fff; white-space: nowrap; }
  button.acc .sum { color: var(--muted); font-size: 13.5px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.acc[aria-expanded=true] { border-bottom-color: transparent; }
  .acc-body { padding: 0 2px 8px 18px; border-bottom: 1px solid #333; }
  .lf { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; align-items: center; gap: 4px 14px; padding: 9px 0; }
  .lf > .name { color: var(--text); font-size: 14px; }
  .lf > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .lf > .hint { grid-column: 2; }
  .lf select, .lf input[type=text] { width: auto; max-width: 100%; }
  .lf .switch { font-size: 14px; }
  .lf input[type=color] { width: 44px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; }
  .range { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; flex: 1; white-space: nowrap; }
  .range input { flex: 1; min-width: 80px; max-width: 240px; accent-color: var(--accent); }
  input.look-toggle { appearance: none; -webkit-appearance: none; width: 40px; height: 22px; border-radius: 11px; background: #555; position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
  input.look-toggle::after { content: ''; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  input.look-toggle:checked { background: var(--accent); }
  input.look-toggle:checked::after { left: 20px; }
  input.look-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.textlink, button.textlink:hover:not(:disabled) { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13.5px; }
  button.textlink:hover:not(:disabled) { text-decoration: underline; }
  /* A row or a flex box hidden by script stays hidden: the flag outranks every display rule. */
  [hidden] { display: none !important; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-back.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(1000px, 100%); max-height: 92vh; overflow: auto; padding: 18px 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .modal.small { width: min(520px, 100%); }
  .modal h2 { font-size: 18px; color: #fff; margin-bottom: 10px; word-break: break-word; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 60; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 92vh; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 70; }
  .toast { background: #333; border-left: 4px solid var(--accent); color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.5); max-width: 380px; font-size: 14px; animation: fade .2s; }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .jobs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .job { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .job .progress { margin-top: 6px; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .header { padding: 10px 12px; }
    .container { padding: 12px 12px 50px; }
    .card .actions button { flex: 1; }
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="title">Glass Manager</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <button class="badge orange hidden" id="upd-badge" style="border:none;cursor:pointer;padding:5px 10px"></button>
  <div class="grow"></div>
  <button id="btn-close" class="hidden"></button>
</div>

<div class="container">
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="themes"></button>
    <button class="tab" data-view="face"></button>
    <button class="tab" data-view="catalog"></button>
    <button class="tab" data-view="artwork"></button>
    <button class="tab" data-view="backups"></button>
    <button class="tab" data-view="screen"></button>
    <button class="tab" data-view="system"></button>
    <button class="tab" data-view="remotes"></button>
    <button class="tab" data-view="status"></button>
  </div>

  <!-- Themes -->
  <section class="view active" id="view-themes">
    <div class="toolbar">
      <input type="search" id="themes-search" class="grow">
      <button id="btn-upload"></button>
      <input type="file" id="upload-file" accept=".zip,application/zip" class="hidden">
      <button id="btn-render-all"></button>
      <button id="btn-themes-refresh"></button>
    </div>
    <div class="jobs" id="jobs-themes"></div>
    <div class="grid" id="themes-grid"></div>
    <div class="panel" style="margin-top:18px">
      <h2 id="rules-title"></h2>
      <div class="form">
        <div class="full">
          <label id="rules-label"></label>
          <input type="text" id="rules-input">
          <div class="help" id="rules-help"></div>
        </div>
        <div class="full">
          <label class="switch"><input type="checkbox" id="preserve-input"><span id="preserve-label"></span></label>
          <div class="help" id="preserve-help"></div>
        </div>
        <div class="full row">
          <button class="primary" id="btn-rules-save"></button>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2 id="cd-title"></h2>
      <div class="help" id="cd-help" style="margin-bottom:12px"></div>
      <div class="form">
        <div class="full"><label class="switch"><input type="checkbox" id="cd-on"><span id="cd-on-label"></span></label></div>
        <div><label id="cd-mode-label"></label><select id="cd-mode"><option value="clock"></option><option value="sun"></option></select></div>
        <div id="cd-offset-block"><label id="cd-offset-label"></label><input type="number" id="cd-offset" min="-180" max="180" step="5" value="0"></div>
        <div><label id="cd-day-theme-label"></label><select id="cd-day-theme"></select></div>
        <div id="cd-day-at-block"><label id="cd-day-at-label"></label><input type="time" id="cd-day-at" value="07:00"></div>
        <div><label id="cd-night-theme-label"></label><select id="cd-night-theme"></select></div>
        <div id="cd-night-at-block"><label id="cd-night-at-label"></label><input type="time" id="cd-night-at" value="20:00"></div>
        <div id="cd-lat-block"><label id="cd-lat-label"></label><input type="text" id="cd-lat" inputmode="decimal"></div>
        <div id="cd-lon-block"><label id="cd-lon-label"></label><input type="text" id="cd-lon" inputmode="decimal"></div>
        <div class="full help" id="cd-location-help"></div>
        <div class="full help" id="cd-now"></div>
        <div class="full row"><button class="primary" id="btn-cd-save"></button></div>
      </div>
    </div>
  </section>

  <!-- Face -->
  <section class="view" id="view-face">
    <div class="panel">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 id="face-title" style="margin:0"></h2>
        <div class="row"><button class="small" id="btn-face-anymote"></button><button class="small" id="btn-face-full"></button></div>
      </div>
      <div class="help" id="face-help" style="margin:10px 0"></div>
      <div class="help" id="face-anymote-help" style="margin:0 0 10px"></div>
      <div id="face-stage"><canvas id="face-canvas" width="16" height="9"></canvas></div>
      <div class="help" id="face-state" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- Catalog -->
  <section class="view" id="view-catalog">
    <div class="toolbar">
      <input type="search" id="catalog-search" class="grow">
      <select id="catalog-size"></select>
      <select id="catalog-kind"></select>
      <select id="catalog-state"></select>
      <button id="btn-catalog-refresh"></button>
    </div>
    <div class="help" id="catalog-info" style="margin-bottom:12px"></div>
    <div class="jobs" id="jobs-catalog"></div>
    <div class="grid" id="catalog-grid"></div>
  </section>

  <!-- Artwork -->
  <section class="view" id="view-artwork">
    <div class="panel">
      <h2 id="disp-title"></h2>
      <div class="help" id="disp-help" style="margin-bottom:12px"></div>
      <div class="form">
        <div class="full">
          <label class="switch"><input type="checkbox" id="disp-fit"><span id="disp-fit-label"></span></label>
        </div>
        <div>
          <label id="disp-position-label"></label>
          <select id="disp-position">
            <option value="center"></option>
            <option value="manual"></option>
          </select>
        </div>
        <div id="disp-x-box">
          <label id="disp-x-label"></label>
          <input type="number" id="disp-x" min="-7680" max="7680">
        </div>
        <div id="disp-y-box">
          <label id="disp-y-label"></label>
          <input type="number" id="disp-y" min="-4320" max="4320">
        </div>
        <div class="full row">
          <button class="primary" id="btn-disp-save"></button>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2 id="art-title"></h2>
      <div class="help" id="art-help" style="margin-bottom:12px"></div>
      <div class="form">
        <div class="full">
          <label class="switch"><input type="checkbox" id="art-enabled"><span id="art-enabled-label"></span></label>
        </div>
        <div>
          <label id="art-keymode-label"></label>
          <select id="art-keymode">
            <option value="personal"></option>
            <option value="project"></option>
          </select>
        </div>
        <div>
          <label id="art-key-label"></label>
          <input type="text" id="art-key" autocomplete="off">
        </div>
        <div>
          <label id="art-interval-label"></label>
          <input type="number" id="art-interval" min="0" max="3600">
        </div>
        <div>
          <label id="art-order-label"></label>
          <select id="art-order">
            <option value="sequential"></option>
            <option value="random"></option>
          </select>
        </div>
        <div>
          <label id="art-transition-label"></label>
          <select id="art-transition">
            <option value="none"></option>
            <option value="fade"></option>
            <option value="merge"></option>
          </select>
        </div>
        <div>
          <label id="art-ms-label"></label>
          <input type="number" id="art-ms" min="50" max="3000">
        </div>
        <div class="full">
          <label class="switch"><input type="checkbox" id="art-unlimited"><span id="art-unlimited-label"></span></label>
          <div class="help" id="art-unlimited-help"></div>
        </div>
        <div class="full row">
          <button class="primary" id="btn-art-save"></button>
          <button id="btn-art-clear"></button>
        </div>
      </div>
    </div>

  // ---- tabs -----------------------------------------------------------
  document.querySelectorAll('.tab').forEach(function (b) {
    b.onclick = function () { showView(b.dataset.view); };
  });
  function showView(name) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.view === name); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + name); });
    try { localStorage.setItem('glass-manager-tab', name); } catch (e) {}
    if (name === 'catalog' && !state.catalog) loadCatalog(false);
    if (name === 'artwork') { loadDisplay(); loadArtwork(); } loadFonts();
    if (name === 'backups') loadBackups();
    if (name === 'status') { loadStatus(); }
    if (name === 'system') { loadUpdate(false); loadEvo(false); if (!stableUi) stableIdle(); loadPerformance(); loadSharing(); loadTouch(); loadLogging(); loadLegacy(); }
    if (name === 'screen') { loadScreen(); }
    if (name === 'remotes') loadRemotes();
    if (window.GlassFace) { if (name === 'face') { GlassFace.show(); } else { GlassFace.hide(); } }
  }

  // ---- remote displays -----------------------------------------------
  function fillRemoteSettings(s) {
    $('rm-enabled').checked = !!s.enabled;
    $('rm-frames').value = s.framesPort;
    $('rm-channel').value = s.channelPort;
    $('rm-beacon').value = s.beaconPort;
  }
  $('btn-rm-apply').onclick = function () {
    $('rm-problem').textContent = '';
    api('POST', '/api/remote/settings', { enabled: $('rm-enabled').checked, framesPort: parseInt($('rm-frames').value, 10), channelPort: parseInt($('rm-channel').value, 10), beaconPort: parseInt($('rm-beacon').value, 10) }).then(function (s) {
      fillRemoteSettings(s);
      toast(t('MANAGER_RM_APPLIED'));
      setTimeout(loadRemotes, 2500);
    }).catch(function (e) { $('rm-problem').textContent = errorText(e); toast(errorText(e), 'error'); });
  };
  function loadRemotes() {
    api('GET', '/api/remote/settings').then(fillRemoteSettings).catch(function () {});
    api('GET', '/api/remote/status').then(function (r) {
      var rows = [];
      if (!r.ports.enabled) {
        $('rm-table').innerHTML = '<tr><td colspan="2">' + esc(t('MANAGER_RM_OFF')) + '</td></tr>';
        $('rm-list').innerHTML = '';
        return;
      }
      rows.push(['MANAGER_RM_PORTS', t('MANAGER_RM_FRAMES') + ' ' + r.ports.frames + ' · ' + t('MANAGER_RM_CHANNEL') + ' ' + r.ports.channel + ' · ' + t('MANAGER_RM_BEACON') + ' ' + r.ports.beacon]);
      var problems = [];
      if (r.errors && r.errors.serve) problems.push(r.errors.serve);
      if (r.errors && r.errors.channel) problems.push(r.errors.channel);
      rows.push(['MANAGER_RM_SERVING', (r.serving ? t('MANAGER_RM_SERVING_UP') : t('MANAGER_RM_SERVING_DOWN')) + (r.serve ? ' · ' + r.serve.sent + ' ' + t('MANAGER_RM_SENT') : '') + (problems.length ? ' · ' + t('MANAGER_RM_PROBLEM') + ' ' + problems.join('; ') : '')]);
      if (r.headless) rows.push(['MANAGER_ST_DISPLAY', t('DISPLAY_OUTPUT_NONE')]);
      $('rm-table').innerHTML = rows.map(function (x) { return '<tr><td>' + esc(t(x[0])) + '</td><td>' + esc(x[1]) + '</td></tr>'; }).join('');
      var subs = {};
      ((r.serve && r.serve.subscribers) || []).forEach(function (s) { subs[s.address.split(':')[0]] = s; });
      var box = $('rm-list');
      box.innerHTML = '';
      var seen = {};
      var items = (r.remotes || []).map(function (m) {
        seen[m.address] = true;
        var s = subs[m.address];
        return { name: m.name || m.id, address: m.address, release: m.release, face: m.face || '', upgrade: m.upgrade || null, screen: m.screen, since: m.since, page: m.page || '', frames: !!s, sent: s ? s.sent : 0 };
      });
      Object.keys(subs).forEach(function (ip) {
        if (!seen[ip]) items.push({ name: subs[ip].name || subs[ip].id, address: ip, release: subs[ip].release, screen: null, since: null, frames: true, sent: subs[ip].sent });
      });
      if (!items.length) { box.innerHTML = '<div class="empty">' + esc(t('MANAGER_RM_NONE')) + '</div>'; return; }
      items.forEach(function (m) {
        var el = document.createElement('div');
        el.className = 'item';
        // What the remote is, and whether a later release of that is out: it upgrades itself, from its own page.
        var behind = m.upgrade && m.upgrade.behind === true;
        el.innerHTML = '<div class="grow"><div class="name">' + esc(m.name) + ' <span class="muted" style="font-weight:normal">' + esc(m.address) + (m.face ? ' · ' + esc(m.face) : '') + (m.release ? ' · ' + (m.face ? 'Glass ' : '') + esc(m.release) : '') + '</span>' +
          (behind ? ' <span class="badge orange" title="' + esc(t('MANAGER_RM_BEHIND_HELP')) + '">' + esc(t('MANAGER_RM_BEHIND').replace('{product}', m.upgrade.product).replace('{latest}', m.upgrade.latest)) + '</span>' : '') + '</div>' +
          (behind ? '<div class="help">' + esc(t('MANAGER_RM_BEHIND_HELP')) + '</div>' : '') +
          '<div class="muted" style="font-size:13px">' + (m.screen && m.screen[0] ? esc(t('MANAGER_RM_SCREEN')) + ' ' + m.screen[0] + 'x' + m.screen[1] + ' · ' : '') +
          esc(m.frames ? t('MANAGER_RM_SUBSCRIBED') + ' (' + m.sent + ')' : t('MANAGER_RM_NOT_SUBSCRIBED')) + (m.since ? ' · ' + esc(t('MANAGER_RM_SINCE')) + ' ' + esc(fmtDate(m.since)) : '') + '</div></div>' +
          // The remote's own settings page opens in this window: on the player's own display a new tab cannot be closed.
          (m.page ? '<a href="' + esc(m.page) + '" style="text-decoration:none"><button class="small">' + esc(t('MANAGER_RM_PAGE')) + '</button></a>' : '') +
          '<span class="badge ' + (m.frames ? 'green' : 'gray') + '">' + esc(m.frames ? 'LIVE' : 'IDLE') + '</span>';
        box.appendChild(el);
      });
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }
  $('btn-rm-refresh').onclick = loadRemotes;

  // ---- themes -----------------------------------------------------------
  function loadThemes() {
    return api('GET', '/api/themes').then(function (data) {
      state.themes = data.themes;
      state.active = data.active;
      renderThemes();
      loadCarDash();
      // The rendered previews come in behind the list; the cards are drawn again once they have.
      var loads = data.themes.filter(function (th) { return th.previews === 'fresh' || th.previews === 'stale'; })
        .map(function (th) { return loadPreviews(th.folder, false).catch(function () {}); });
      return Promise.all(loads).then(renderThemes);
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }
  function themeSize(th) { return th.width && th.height ? th.width + 'x' + th.height : ''; }
  function renderThemes() {
    var q = $('themes-search').value.trim().toLowerCase();
    var grid = $('themes-grid');
    grid.innerHTML = '';
    var shown = 0;
    (state.themes || []).forEach(function (th) {
      if (q && th.folder.toLowerCase().indexOf(q) === -1 && !th.meters.some(function (m) { return m.toLowerCase().indexOf(q) !== -1; })) return;
      shown++;
      var card = document.createElement('div');
      card.className = 'card' + (th.active ? ' active-theme' : '');
      var pv = state.previews[th.folder];
      var first = pv && pv.meters && pv.meters.length ? pv.meters[0] : null;
      var thumbHtml;
      if (first) {
        thumbHtml = '<img loading="lazy" src="' + esc(first.thumb) + '&v=' + encodeURIComponent(th.mtime) + '" alt="">';
      } else if (th.empty) {
        thumbHtml = '<div class="placeholder">' + esc(t('MANAGER_EMPTY_THEME')) + '</div>';
      } else if (th.previews === 'rendering' || th.previews === 'queued') {
        thumbHtml = '<div class="placeholder">' + esc(t('MANAGER_RENDERING')) + '</div>';
      } else {
        thumbHtml = '<div class="placeholder">' + esc(t('MANAGER_NO_PREVIEW')) + '</div>';
      }
      var badges = '';
      if (th.active) badges += '<span class="badge green">' + esc(t('THEME_GALLERY_ACTIVE')) + '</span> ';
      card.innerHTML =
        '<div class="thumb">' + thumbHtml + (badges ? '<div class="badge-wrap" style="position:absolute;top:8px;left:8px">' + badges + '</div>' : '') + '</div>' +
        '<div class="body">' +
          '<div class="title">' + esc(th.folder) + '</div>' +
          '<div class="meta">' +
            (themeSize(th) ? '<span>' + esc(themeSize(th)) + '</span>' : '') +
            '<span>' + th.meters.length + ' ' + esc(t('MANAGER_METERS_N')) + '</span>' +
            (th.spectrum ? '<span class="badge blue">' + esc(t('MANAGER_KIND_SPECTRUM')) + '</span>' : '') +
            (th.catalog ? '<span class="badge gray">' + esc(t('MANAGER_FROM_CATALOG')) + '</span>' : '') +
            '<span>' + esc(fmtBytes(th.bytes)) + '</span>' +
          '</div>' +
          '<div class="actions">' +
            (th.active ? '' : '<button class="small primary" data-act="activate">' + esc(t('MANAGER_ACTIVATE')) + '</button>') +
            '<button class="small" data-act="details">' + esc(t('MANAGER_DETAILS')) + '</button>' +
            (runningJob(th.folder, 'tailor') ? '<button class="small" disabled>' + esc(t('MANAGER_TAILOR_RUNNING')) + '</button>' : '<button class="small" data-act="tailor">' + esc(t('MANAGER_TAILOR_BTN')) + '</button>') +
            (runningJob(th.folder, 'package') ? '<button class="small" disabled>' + esc(t('MANAGER_PACKAGE_RUNNING')) + '</button>' : '<button class="small" data-act="package">' + esc(t('MANAGER_PACKAGE_BTN')) + '</button>') +
            '<button class="small danger" data-act="remove">' + esc(t('THEME_REMOVE_BTN')) + '</button>' +
          '</div>' +
        '</div>';
      card.querySelector('.thumb').onclick = function () { openTheme(th.folder); };
      card.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.act === 'activate') activateTheme(th.folder);
          else if (b.dataset.act === 'details') openTheme(th.folder);
          else if (b.dataset.act === 'remove') removeTheme(th.folder);
          else if (b.dataset.act === 'tailor') tailorTheme(th);
          else if (b.dataset.act === 'package') packageTheme(th.folder);
        };
      });
      grid.appendChild(card);
    });
    if (!shown) grid.innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc(t('MANAGER_NO_THEMES')) + '</div>';
  }
  $('themes-search').oninput = renderThemes;
  $('btn-themes-refresh').onclick = loadThemes;

  function loadPreviews(folder, rerender) {
    return api('GET', '/api/themes/' + encodeURIComponent(folder) + '/previews').then(function (data) {
      state.previews[folder] = data;
      var th = (state.themes || []).find(function (x) { return x.folder === folder; });
      if (th) th.previews = data.state;
      if (rerender !== false) renderThemes();
      if (state.currentTheme === folder) renderThemeModal();
      return data;
    });
  }

  function activateTheme(folder) {
    return api('POST', '/api/themes/' + encodeURIComponent(folder) + '/activate').then(function () {
      toast(t('MANAGER_ACTIVATED') + ' ' + folder);
      return loadThemes().then(function () { if (state.currentTheme === folder) openTheme(folder); });
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }

  // The cutter: a copy of the theme at another size, the active theme's
  // size offered first as the screen's.
  var tailorResolve = null;
  function tailorTheme(th) {
    var active = (state.themes || []).find(function (x) { return x.active; }) || th;
    $('tl-title').textContent = t('MANAGER_TAILOR_TITLE') + ' ' + th.folder;
    $('tl-help').textContent = t('MANAGER_TAILOR_DOC');
    $('tl-width').value = active.width || th.width || '';
    $('tl-height').value = active.height || th.height || '';
    $('tl-stretch').checked = false;
    $('tailor-modal').classList.add('open');
    tailorResolve = function (go) {
      $('tailor-modal').classList.remove('open');

  // The job is the Manager's own: no restart, the page reads it to its end.

        setTimeout(tick, 700);

  // The job runs until the backend restarts; then the page waits for the target version to answer.
  // `where`: the element the job is drawn in, where not the update panel's;
  // `same`, the version stays and only the backend restarts, so the page
  // waits for it to go before it takes an answer for the one that came
  // back; `failed`, called when the job fails.
  function followUpgrade(job, where) {
    var target = job.target;
    var opts = where || {};
    var jobsEl = $(opts.jobs || 'jobs-update');
    var wentDown = !opts.same;
    $('btn-upd-install').disabled = true;
    $('btn-upd-rollback').disabled = true;
    var draw = function (j, extra) {
      var pct = j.progress && j.progress.total ? Math.round(j.progress.done * 100 / j.progress.total) : 0;
      var label = { queued: 'MANAGER_JOB_QUEUED', downloading: 'MANAGER_JOB_DOWNLOADING', verifying: 'MANAGER_JOB_CHECKING', 'backing-up': 'MANAGER_JOB_BACKING_UP', applying: 'MANAGER_JOB_APPLYING', restarting: 'MANAGER_UPD_RESTARTING', failed: 'MANAGER_JOB_FAILED' }[j.state] || j.state;
      jobsEl.innerHTML = '<div class="job"><b>' + esc(j.name) + '</b> · ' + esc(t(label)) + (extra ? ' · ' + esc(extra) : '') +
        (j.state === 'downloading' || j.state === 'backing-up' ? ' ' + pct + '%<div class="progress"><div style="width:' + pct + '%"></div></div>' : '') +
        (j.state === 'failed' && j.error ? ' <span class="muted">' + esc(errorText({ code: j.error.error, message: j.error.message })) + '</span>' : '') + '</div>';
    };
    draw(job);
    var restarting = false;
    var started = Date.now();
    var tick = function () {
      if (!restarting) {
        api('GET', '/api/jobs/' + job.id).then(function (data) {
          draw(data.job);
          if (data.job.state === 'failed') { $('btn-upd-install').disabled = false; $('btn-upd-rollback').disabled = false; loadUpdate(false); if (opts.failed) opts.failed(); return; }
          if (data.job.state === 'restarting') { restarting = true; started = Date.now(); if (data.job.target) target = data.job.target; }
          setTimeout(tick, 1000);
        }).catch(function () {
          // The plugin manager stopped the plugin, and this page's server with it.
          restarting = true;
          wentDown = true;
          started = Date.now();
          draw({ name: job.name, state: 'restarting' });
          setTimeout(tick, 3000);
        });
        return;
      }
      api('GET', '/api/status').then(function (s) {
        // An answer from the backend that has not gone yet is not the one waited for.
        if (s.version === target && (wentDown || Date.now() - started > 30000)) {
          draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_DONE') + ' ' + s.version);
          toast(t('MANAGER_UPD_DONE') + ' ' + s.version);
          setTimeout(function () { window.location.reload(); }, 2500);
          return;
        }
        draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_WAITING'));
        if (Date.now() - started > 240000) { draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_NOT_BACK')); return; }
        setTimeout(tick, 3000);
      }).catch(function () {
        wentDown = true;
        draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_WAITING'));
        if (Date.now() - started > 240000) { draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_NOT_BACK')); return; }
        setTimeout(tick, 3000);
      });
    };
    setTimeout(tick, 1000);
  }

  // ---- back to the stable release ------------------------------------------
  // The latest release that is no test release, of Glass and of glass-evo,

  var stableUi = null;
  function stableIdle() {

      if (view.error) return failed(view.error.message || view.error.error);

  // What the act does about one of the two releases, as a sentence.
  function stableStepLine(name, step) {
    if (!step || !step.from) return '';
    return t(step.action === 'none' ? 'MANAGER_STABLE_SUM_STAYS' : 'MANAGER_STABLE_SUM_REPLACED').replace('{name}', name).replace('{from}', step.from).replace('{to}', step.to || '');
  }
  function stableStep() {
    var ui = stableUi;
    var qs = ui.view.questions;
    var html;
    var links = (ui.at > 0 ? '<button class="textlink" data-stable="back">' + esc(t('MANAGER_STABLE_BACK')) + '</button>' : '') + '<button class="textlink" data-stable="cancel">' + esc(t('MANAGER_CANCEL')) + '</button>';
    if (ui.at < qs.length) {
      var q = qs[ui.at];
      var key = q.id.toUpperCase();
      var said = ui.keep[q.id];
      html = '<div class="help">' + esc(t('MANAGER_STABLE_STEP').replace('{n}', ui.at + 1).replace('{total}', qs.length)) + '</div>' +
        '<h3 style="margin:6px 0">' + esc(t('MANAGER_STABLE_Q_' + key)) + '</h3>' +
        '<div class="help">' + esc(t('MANAGER_STABLE_H_' + key)) + '</div>' +
        '<div class="row" style="margin-top:10px"><button data-stable="yes"' + (said ? ' class="primary"' : '') + '>' + esc(t('MANAGER_STABLE_YES')) + '</button>' +
        '<button data-stable="no"' + (said ? '' : ' class="primary"') + '>' + esc(t('MANAGER_STABLE_NO')) + '</button>' + links + '</div>' +
        '<div class="help" style="margin-top:6px">' + esc(t(q.keep ? 'MANAGER_STABLE_SUGGEST_YES' : 'MANAGER_STABLE_SUGGEST_NO')) + '</div>';
    } else {
      var part = function (q) { return t('MANAGER_STABLE_P_' + q.id.toUpperCase()); };
      // The screen's owner and the test releases are said as what happens, not as settings.
      var settings = qs.filter(function (q) { return q.id !== 'owner' && q.id !== 'tests'; });
      var kept = qs.filter(function (q) { return ui.keep[q.id]; }).map(part);
      var reset = settings.filter(function (q) { return !ui.keep[q.id]; }).map(part);
      var lines = [stableStepLine('Glass', ui.view.glass), stableStepLine('glass-evo', ui.view.evo)].filter(Boolean);
      if (ui.view.facts.holds && !ui.keep.owner) lines.push(t('MANAGER_STABLE_SUM_OWNER_BACK'));
      if (ui.view.facts.tests && !ui.keep.tests) lines.push(t('MANAGER_STABLE_SUM_TESTS_OFF'));
      lines.push(t('MANAGER_STABLE_SUM_KEPT') + ' ' + (kept.length ? kept.join(', ') : t('MANAGER_STABLE_NOTHING')) + '.');
      lines.push(t('MANAGER_STABLE_SUM_RESET') + ' ' + (reset.length ? reset.join(', ') : t('MANAGER_STABLE_NOTHING')) + '.');
      html = '<h3 style="margin:6px 0">' + esc(t('MANAGER_STABLE_SUM_TITLE')) + '</h3>' +
        '<ul style="margin:6px 0 6px 18px;padding:0">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
        '<div class="help">' + esc(t('MANAGER_STABLE_SUM_BACKUP')) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="primary" data-stable="do">' + esc(t('MANAGER_STABLE_DO')) + '</button>' + links + '</div>';
    }
    $('stable-body').innerHTML = html;
  }
  $('stable-body').addEventListener('click', function (e) {
    var b = e.target.closest('[data-stable]');
    var ui = stableUi;
    if (!b || !ui) return;
    var what = b.getAttribute('data-stable');
    if (what === 'cancel') return stableIdle();
    if (what === 'back') { ui.at = Math.max(0, ui.at - 1); return stableStep(); }
    if (what === 'yes' || what === 'no') { ui.keep[ui.view.questions[ui.at].id] = what === 'yes'; ui.at++; return stableStep(); }
    if (what === 'do') {
      b.disabled = true;
      api('POST', '/api/stable', { keep: ui.keep }).then(function (data) {
        $('stable-body').innerHTML = '';
        followUpgrade(data.job, { jobs: 'jobs-stable', same: data.job.same === true, failed: stableIdle });
      }).catch(function (err) { b.disabled = false; toast(errorText(err), 'error'); });
    }
  });

  // ---- the kiosk's keyboard ----------------------------------------------
  // Inside Volumio's page on the player's own display, text is typed on
  // Volumio's on-screen keyboard: the page tells the parent when an input
  // takes focus and takes the keystrokes the parent relays back.
  if (window.parent !== window) {
    var kbInput = null;
    var kbRelay = false;
    var kbHide = null;
    var kbStyle = document.createElement('style');
    kbStyle.textContent = '.volumio-keyboard-focused { outline: 2px solid var(--accent) !important; outline-offset: -2px !important; }';
    document.head.appendChild(kbStyle);
    var kbTell = function (action) {
      try { window.parent.postMessage({ type: 'volumio-input-focus', action: action }, '*'); } catch (e) {}
    };
    document.addEventListener('focusin', function (e) {
      if (!e.target.matches('input[type=text], input[type=search], input[type=number], textarea')) return;
      kbInput = e.target;
      kbRelay = true;
      e.target.classList.add('volumio-keyboard-focused');
      if (kbHide) { clearTimeout(kbHide); kbHide = null; }
      kbTell('show-keyboard');
    }, true);
    document.addEventListener('focusout', function (e) {
      if (!e.target.matches('input, textarea') || kbRelay) return;
      kbHide = setTimeout(function () {
        kbInput = null;
        e.target.classList.remove('volumio-keyboard-focused');
        kbTell('hide-keyboard');
        kbHide = null;
      }, 300);
    }, true);
    document.addEventListener('click', function (e) {
      if (!kbRelay || e.target.matches('input, textarea')) return;
      kbRelay = false;
      if (kbInput) { kbInput.classList.remove('volumio-keyboard-focused'); kbInput = null; }
      kbTell('hide-keyboard');
    }, true);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'volumio-keystroke' || e.data.action !== 'input' || !kbInput) return;
      var input = kbInput;
      var at = input.selectionStart || 0;
      var text = input.value || '';
      var typed = String(e.data.value || '');
      input.value = text.substring(0, at) + typed + text.substring(at);
      try { input.setSelectionRange(at + typed.length, at + typed.length); } catch (err) {}
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.classList.add('volumio-keyboard-focused');
    }, false);
  }

  // ---- start ------------------------------------------------------------
  if (window.parent === window) {
    $('btn-close').classList.remove('hidden');
    $('btn-close').onclick = function () {
      window.close();
      setTimeout(function () { if (!window.closed) { if (window.history.length > 1) window.history.back(); else window.location.href = '/'; } }, 100);
    };
  }
  api('GET', '/api/i18n').then(function (data) { S = data.strings || {}; }).catch(function () {}).then(function () {
    applyStrings();
    if (window.GlassFace) GlassFace.init({ t: t, version: function () { return state.status && state.status.version ? state.status.version : ''; } });
    loadThemes().then(loadSettings);
    loadStatus();
    api('GET', '/api/update').then(updateBadge).catch(function () {});
    // The tab: from the address (#catalog), else the one last looked at.
    var saved = (window.location.hash || '').slice(1);
    if (!saved) { try { saved = localStorage.getItem('glass-manager-tab'); } catch (e) {} }
    if (saved && saved !== 'themes' && $('view-' + saved)) showView(saved);
  });
  window.addEventListener('hashchange', function () {
    var name = (window.location.hash || '').slice(1);
    if (name && $('view-' + name)) showView(name);
  });
})();
</script>
</body>
</html>
