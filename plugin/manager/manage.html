<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Manager</title>
<style>
  :root {
    --bg: #1c1c1c; --panel: #262626; --panel2: #303030; --line: #404040;
    --text: #e6e6e6; --muted: #9a9a9a; --accent: #54b948; --accent2: #3f8f37;
    --warn: #e6a23c; --danger: #d64545; --info: #4a90e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 6px; transition: background .15s, border-color .15s; }
  button:hover:not(:disabled) { background: #3a3a3a; border-color: #555; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); }
  button.danger { color: #ffb3b3; border-color: #6b2a2a; }
  button.danger:hover:not(:disabled) { background: #4a1f1f; }
  button.small { padding: 5px 10px; font-size: 13px; }
  input[type=text], input[type=number], input[type=search], input[type=password], select, textarea { font: inherit; background: #1a1a1a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .header { position: sticky; top: 0; z-index: 20; background: #232323; border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .header h1 { font-size: 19px; font-weight: 600; color: #fff; }
  .header .sub { color: var(--muted); font-size: 13px; }
  .header .grow { flex: 1; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 18px; white-space: nowrap; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { background: none; color: #fff; }
  .view { display: none; }
  .view.active { display: block; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar .grow { flex: 1; min-width: 200px; }
  .toolbar select { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card.active-theme { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .thumb { position: relative; background: #111; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .placeholder { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
  .thumb .badge { position: absolute; top: 8px; left: 8px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .3px; padding: 2px 8px; border-radius: 10px; background: #444; color: #ddd; text-transform: uppercase; }
  .badge.green { background: var(--accent); color: #fff; }
  .badge.blue { background: var(--info); color: #fff; }
  .badge.orange { background: var(--warn); color: #222; }
  .badge.gray { background: #3a3a3a; color: #bbb; }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .title { font-weight: 600; color: #fff; word-break: break-word; }
  .card .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .progress { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin-bottom: 12px; color: #fff; }
  .panel h3 { font-size: 14px; margin: 14px 0 8px; color: #ddd; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; }
  .form .full { grid-column: 1 / -1; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text); font-size: 15px; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent); }
  .help { color: var(--muted); font-size: 13px; }
  #face-stage { background: #000; border-radius: 8px; overflow: hidden; }
  #face-canvas { display: block; width: 100%; height: auto; image-rendering: auto; }
  #face-stage:fullscreen { display: flex; align-items: center; justify-content: center; background: #000; border-radius: 0; }
  #face-stage:fullscreen canvas { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  table.kv { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 7px 8px; border-bottom: 1px solid #333; vertical-align: top; }
  table.kv td:first-child { color: var(--muted); width: 38%; }
  table.kv tr.section td { background: var(--panel2); color: #fff; font-weight: 600; padding-top: 9px; padding-bottom: 9px; }
  table.kv td { white-space: pre-wrap; }
  .diag-list { display: flex; flex-direction: column; gap: 6px; }
  .diag-list button { text-align: left; }
  .finding { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid #333; align-items: start; white-space: pre-wrap; }
  .finding .kind { color: var(--muted); font-size: 13px; padding-top: 2px; }
  .finding.cause .kind { color: var(--warn); font-weight: 600; }
  .finding.ok { color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .item .grow { flex: 1; min-width: 160px; }
  .item .name { font-weight: 600; color: #fff; }
  .meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .meters .m { background: #111; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; }
  .meters .m img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: contain; background: #0a0a0a; }
  .meters .m div { padding: 6px 8px; font-size: 13px; color: #ddd; word-break: break-word; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 14px; }
  /* A row or a flex box hidden by script stays hidden: the flag outranks every display rule. */
  [hidden] { display: none !important; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-back.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(1000px, 100%); max-height: 92vh; overflow: auto; padding: 18px 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .modal.small { width: min(520px, 100%); }
  .modal h2 { font-size: 18px; color: #fff; margin-bottom: 10px; word-break: break-word; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 60; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 92vh; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 70; }
  .toast { background: #333; border-left: 4px solid var(--accent); color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.5); max-width: 380px; font-size: 14px; animation: fade .2s; }
  .toast.error { border-left-color: var(--danger); }
  .toast.warn { border-left-color: var(--warn); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .jobs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .job { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .job .progress { margin-top: 6px; }
  .hidden { display: none !important; }
  @media (max-width: 600px) {
    .header { padding: 10px 12px; }
    .container { padding: 12px 12px 50px; }
    .card .actions button { flex: 1; }
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="title">Glass Manager</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <button class="badge orange hidden" id="upd-badge" style="border:none;cursor:pointer;padding:5px 10px"></button>
  <div class="grow"></div>
  <button id="btn-close" class="hidden"></button>
</div>

<div class="container">
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="themes"></button>
    <button class="tab" data-view="face"></button>
    <button class="tab" data-view="catalog"></button>
    <button class="tab" data-view="artwork"></button>
    <button class="tab" data-view="backups"></button>
    <button class="tab" data-view="screen"></button>
    <button class="tab" data-view="system"></button>
    <button class="tab" data-view="remotes"></button>
    <button class="tab" data-view="status"></button>
  </div>

  <!-- Themes -->
  <section class="view active" id="view-themes">
    <div class="toolbar">
      <input type="search" id="themes-search" class="grow">
      <button id="btn-upload"></button>
      <input type="file" id="upload-file" accept=".zip,application/zip" class="hidden">
      <button id="btn-render-all"></button>
      <button id="btn-themes-refresh"></button>
    </div>
    <div class="jobs" id="jobs-themes"></div>
    <div class="grid" id="themes-grid"></div>
    <div class="panel" style="margin-top:18px">
      <h2 id="rules-title"></h2>
      <div class="form">
        <div class="full">
          <label id="rules-label"></label>
          <input type="text" id="rules-input">
          <div class="help" id="rules-help"></div>
        </div>
        <div class="full">
          <label class="switch"><input type="checkbox" id="preserve-input"><span id="preserve-label"></span></label>
          <div class="help" id="preserve-help"></div>
        </div>
        <div class="full row">
          <button class="primary" id="btn-rules-save"></button>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2 id="cd-title"></h2>
      <div class="help" id="cd-help" style="margin-bottom:12px"></div>
      <div class="form">
        <div class="full"><label class="switch"><input type="checkbox" id="cd-on"><span id="cd-on-label"></span></label></div>
        <div><label id="cd-mode-label"></label><select id="cd-mode"><option value="clock"></option><option value="sun"></option></select></div>
        <div id="cd-offset-block"><label id="cd-offset-label"></label><input type="number" id="cd-offset" min="-180" max="180" step="5" value="0"></div>
        <div><label id="cd-day-theme-label"></label><select id="cd-day-theme"></select></div>
        <div id="cd-day-at-block"><label id="cd-day-at-label"></label><input type="time" id="cd-day-at" value="07:00"></div>
        <div><label id="cd-night-theme-label"></label><select id="cd-night-theme"></select></div>
        <div id="cd-night-at-block"><label id="cd-night-at-label"></label><input type="time" id="cd-night-at" value="20:00"></div>
        <div id="cd-lat-block"><label id="cd-lat-label"></label><input type="text" id="cd-lat" inputmode="decimal"></div>
        <div id="cd-lon-block"><label id="cd-lon-label"></label><input type="text" id="cd-lon" inputmode="decimal"></div>
        <div class="full help" id="cd-location-help"></div>
        <div class="full help" id="cd-now"></div>
        <div class="full row"><button class="primary" id="btn-cd-save"></button></div>
      </div>
    </div>
  </section>

  <!-- Face -->
  <section class="view" id="view-face">
    <div class="panel">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 id="face-title" style="margin:0"></h2>
        <div class="row"><button class="small" id="btn-face-anymote"></button><button class="small" id="btn-face-full"></button></div>
      </div>
      <div class="help" id="face-help" style="margin:10px 0"></div>
      <div class="help" id="face-anymote-help" style="margin:0 0 10px"></div>
      <div id="face-stage"><canvas id="face-canvas" width="16" height="9"></canvas></div>
      <div class="help" id="face-state" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- Catalog -->
  <section class="view" id="view-catalog">
    <div class="toolbar">
      <input type="search" id="catalog-search" class="grow">
      <select id="catalog-size"></select>
      <select id="catalog-kind"></select>
      <select id="catalog-state"></select>
      <button id="btn-catalog-refresh"></button>
    </div>
    <div class="help" id="catalog-info" style="margin-bottom:12px"></div>
    <div class="jobs" id="jobs-catalog"></div>
    <div class="grid" id="catalog-grid"></div>
  </section>

  <!-- Artwork -->
  <section class="view" id="view-artwork">
    <div class="panel">
      <h2 id="disp-title"></h2>
      <div class="help" id="disp-help" style="margin-bottom:12px"></div>
      <div class="form">
        <div class="full">
          <label class="switch"><input type="checkbox" id="disp-fit"><span id="disp-fit-label"></span></label>
        </div>
        <div>
          <label id="disp-position-label"></label>
          <select id="disp-position">
            <option value="center"></option>
            <option value="manual"></option>
          </select>
        </div>
        <div id="disp-x-box">
          <label id="disp-x-label"></label>
          <input type="number" id="disp-x" min="0" max="7680">
        </div>
        <div id="disp-y-box">
          <label id="disp-y-label"></label>
          <input type="number" id="disp-y" min="0" max="4320">
        </div>
        <div class="full row">
          <button class="primary" id="btn-disp-save"></button>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2 id="art-title"></h2>
      <div class="help" id="art-help" style="margin-bottom:12px"></div>
      <div class="form">
        <div class="full">
          <label class="switch"><input type="checkbox" id="art-enabled"><span id="art-enabled-label"></span></label>
        </div>
        <div>
          <label id="art-keymode-label"></label>
          <select id="art-keymode">
            <option value="personal"></option>
            <option value="project"></option>
          </select>
        </div>
        <div>
          <label id="art-key-label"></label>
          <input type="text" id="art-key" autocomplete="off">
        </div>
        <div>
          <label id="art-interval-label"></label>
          <input type="number" id="art-interval" min="0" max="3600">
        </div>
        <div>
          <label id="art-order-label"></label>
          <select id="art-order">
            <option value="sequential"></option>
            <option value="random"></option>
          </select>
        </div>
        <div>
          <label id="art-transition-label"></label>
          <select id="art-transition">
            <option value="none"></option>
            <option value="fade"></option>
            <option value="merge"></option>
          </select>
        </div>
        <div>
          <label id="art-ms-label"></label>
          <input type="number" id="art-ms" min="50" max="3000">
        </div>
        <div class="full">
          <label class="switch"><input type="checkbox" id="art-unlimited"><span id="art-unlimited-label"></span></label>
          <div class="help" id="art-unlimited-help"></div>
        </div>
        <div class="full row">
          <button class="primary" id="btn-art-save"></button>
          <button id="btn-art-clear"></button>
        </div>
      </div>
    </div>
      <div class="panel">
      <h2 id="fonts-title"></h2>
      <div class="help" id="fonts-help" style="margin-bottom:12px"></div>
      <div class="form" id="fonts-styles"></div>
      <div class="help" id="fonts-shipped" style="margin-top:8px"></div>
      <div class="row" style="margin-top:12px"><button class="primary" id="btn-fonts-save"></button></div>
      <h3 id="fonts-custom-title" style="margin-top:20px"></h3>
      <div class="help" id="fonts-custom-doc" style="margin-bottom:8px"></div>
      <div class="list" id="fonts-custom-list"></div>
      <div class="row" style="margin-top:12px">
        <input type="file" id="fonts-file" accept=".ttf,.otf,font/ttf,font/otf" class="hidden">
        <button id="btn-fonts-upload"></button>
      </div>
    </div>
</section>

  <!-- Backups -->
  <section class="view" id="view-backups">
    <div class="panel">
      <h2 id="bk-title"></h2>
      <div class="help" id="bk-help" style="margin-bottom:12px"></div>
      <div class="row">
        <input type="text" id="bk-name" maxlength="64" style="flex:1;min-width:200px">
        <button class="primary" id="btn-bk-create"></button>
        <button id="btn-bk-upload"></button>
        <input type="file" id="bk-upload-file" accept=".zip,application/zip" class="hidden">
      </div>
    </div>
    <div class="list" id="bk-list"></div>
  </section>

  <!-- Remotes -->
  <section class="view" id="view-screen">
    <div class="panel" id="screen-panel">
      <h2 id="screen-title" style="margin:0 0 10px"></h2>
      <div class="help" id="screen-help" style="margin-bottom:10px"></div>
      <div class="form">
        <div class="full" id="screen-now"></div>
        <div class="full"><button class="small" id="btn-screen-details"></button></div>
        <div class="screen-controls"><label id="screen-rotation-label"></label><select id="screen-rotation"><option value="0">0</option><option value="90">90</option><option value="180">180</option><option value="270">270</option></select></div>
        <div class="screen-controls"><label id="screen-pointer-label"></label><select id="screen-pointer"><option value="auto"></option><option value="show"></option><option value="hide"></option></select></div>
        <div class="full help screen-controls" id="screen-suggested"></div>
        <div class="full row screen-controls"><button class="primary" id="btn-screen-apply"></button></div>
      </div>
    </div>
    <div class="panel" id="touch-map-panel">
      <h2 id="touch-map-title" style="margin:0 0 10px"></h2>
      <div class="help" id="touch-map-help" style="margin-bottom:10px"></div>
      <div class="form">
        <div><label id="touch-map-label"></label><select id="touch-map"><option value="auto"></option><option value="overrides"></option><option value="calibrated"></option></select></div>
        <div class="full row" id="touch-overrides" style="gap:18px"><label><input type="checkbox" id="touch-swap"> <span id="touch-swap-label"></span></label><label><input type="checkbox" id="touch-flip-x"> <span id="touch-flip-x-label"></span></label><label><input type="checkbox" id="touch-flip-y"> <span id="touch-flip-y-label"></span></label></div>
        <div class="full help" id="touch-map-state"></div>
        <div class="full row"><button class="primary" id="btn-touch-map-apply"></button><button id="btn-touch-calibrate"></button></div>
        <div class="full help" id="touch-calibrate-help"></div>
      </div>
    </div>
  </section>
  <section class="view" id="view-system">
    <div class="panel" id="upd-panel">
      <div class="row" style="justify-content:space-between">
        <h2 id="upd-title" style="margin:0"></h2>
        <button class="small" id="btn-upd-check"></button>
      </div>
      <div id="upd-body" style="margin-top:10px"></div>
      <div class="jobs" id="jobs-update" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px">
        <button class="primary hidden" id="btn-upd-install"></button>
        <button class="hidden" id="btn-upd-rollback"></button>
        <button class="small hidden" id="btn-upd-notes"></button>
      </div>
      <pre id="upd-notes" class="hidden" style="white-space:pre-wrap;margin-top:10px;font:inherit;font-size:13px;color:#ccc;background:#1a1a1a;border:1px solid var(--line);border-radius:8px;padding:10px"></pre>
    </div>
    <div class="panel" id="perf-panel">
      <h2 id="perf-title" style="margin:0 0 10px"></h2>
      <div class="help" id="perf-help" style="margin-bottom:10px"></div>
      <div class="form">
        <div><label id="perf-profile-label"></label><select id="perf-profile"></select></div>
        <div class="full help" id="perf-board"></div>
        <div class="full" id="perf-values"></div>
        <div class="full"><label class="switch"><input type="checkbox" id="perf-governor"><span id="perf-governor-label"></span></label><div class="help" id="perf-governor-help"></div></div>
      </div>
      <div class="row" style="margin-top:10px"><button class="primary" id="btn-perf-apply"></button></div>
    </div>
    <div class="panel" id="touch-panel">
      <h2 id="touch-title" style="margin:0 0 10px"></h2>
      <div class="help" id="touch-help" style="margin-bottom:10px"></div>
      <div class="form">
        <div><label id="touch-mode-label"></label><select id="touch-mode"><option value="theme"></option><option value="on"></option><option value="off"></option></select></div>
        <div class="full row"><button class="primary" id="btn-touch-apply"></button></div>
      </div>
    </div>
    <div class="panel" id="share-panel">
      <h2 id="share-title" style="margin:0 0 10px"></h2>
      <div class="help" id="share-help" style="margin-bottom:10px"></div>
      <div class="form">

    $('tm-change-label').textContent = t('RANDOMMODE');
    $('tm-change').options[0].textContent = t('MANAGER_CHANGE_INTERVAL');
    $('tm-change').options[1].textContent = t('MANAGER_CHANGE_TITLE');
    $('tm-interval-label').textContent = t('RANDOMINTERVAL');
    $('tm-names-label').textContent = t('MANAGER_METERS');
    $('tm-save').textContent = t('MANAGER_SAVE');
    $('cf-cancel').textContent = t('MANAGER_CANCEL');
    var sizeSel = $('catalog-size'); sizeSel.innerHTML = '<option value="">' + esc(t('MANAGER_ALL_SIZES')) + '</option>';
    var kindSel = $('catalog-kind'); kindSel.innerHTML = '<option value="">' + esc(t('MANAGER_ALL_KINDS')) + '</option><option value="meter">' + esc(t('MANAGER_KIND_METER')) + '</option><option value="meter+spectrum">' + esc(t('MANAGER_KIND_BOTH')) + '</option><option value="spectrum">' + esc(t('MANAGER_KIND_SPECTRUM')) + '</option>';
    var stateSel = $('catalog-state'); stateSel.innerHTML = '<option value="">' + esc(t('MANAGER_ALL_STATES')) + '</option><option value="absent">' + esc(t('MANAGER_STATE_ABSENT')) + '</option><option value="installed">' + esc(t('MANAGER_STATE_INSTALLED')) + '</option><option value="update">' + esc(t('MANAGER_STATE_UPDATE')) + '</option>';
  }

  // ---- tabs -----------------------------------------------------------
  document.querySelectorAll('.tab').forEach(function (b) {
    b.onclick = function () { showView(b.dataset.view); };
  });
  function showView(name) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.view === name); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + name); });
    try { localStorage.setItem('glass-manager-tab', name); } catch (e) {}
    if (name === 'catalog' && !state.catalog) loadCatalog(false);
    if (name === 'artwork') { loadDisplay(); loadArtwork(); } loadFonts();
    if (name === 'backups') loadBackups();
    if (name === 'status') { loadStatus(); }
    if (name === 'system') { loadUpdate(false); loadPerformance(); loadSharing(); loadTouch(); loadLogging(); loadLegacy(); }
    if (name === 'screen') { loadScreen(); }
    if (name === 'remotes') loadRemotes();
    if (window.GlassFace) { if (name === 'face') { GlassFace.show(); } else { GlassFace.hide(); } }
  }

  // ---- remote displays -----------------------------------------------
  function fillRemoteSettings(s) {
    $('rm-enabled').checked = !!s.enabled;
    $('rm-frames').value = s.framesPort;
    $('rm-channel').value = s.channelPort;
    $('rm-beacon').value = s.beaconPort;
  }
  $('btn-rm-apply').onclick = function () {
    $('rm-problem').textContent = '';
    api('POST', '/api/remote/settings', { enabled: $('rm-enabled').checked, framesPort: parseInt($('rm-frames').value, 10), channelPort: parseInt($('rm-channel').value, 10), beaconPort: parseInt($('rm-beacon').value, 10) }).then(function (s) {
      fillRemoteSettings(s);
      toast(t('MANAGER_RM_APPLIED'));
      setTimeout(loadRemotes, 2500);
    }).catch(function (e) { $('rm-problem').textContent = errorText(e); toast(errorText(e), 'error'); });
  };
  function loadRemotes() {
    api('GET', '/api/remote/settings').then(fillRemoteSettings).catch(function () {});
    api('GET', '/api/remote/status').then(function (r) {
      var rows = [];
      if (!r.ports.enabled) {
        $('rm-table').innerHTML = '<tr><td colspan="2">' + esc(t('MANAGER_RM_OFF')) + '</td></tr>';
        $('rm-list').innerHTML = '';
        return;
      }
      rows.push(['MANAGER_RM_PORTS', t('MANAGER_RM_FRAMES') + ' ' + r.ports.frames + ' · ' + t('MANAGER_RM_CHANNEL') + ' ' + r.ports.channel + ' · ' + t('MANAGER_RM_BEACON') + ' ' + r.ports.beacon]);
      var problems = [];
      if (r.errors && r.errors.serve) problems.push(r.errors.serve);
      if (r.errors && r.errors.channel) problems.push(r.errors.channel);
      rows.push(['MANAGER_RM_SERVING', (r.serving ? t('MANAGER_RM_SERVING_UP') : t('MANAGER_RM_SERVING_DOWN')) + (r.serve ? ' · ' + r.serve.sent + ' ' + t('MANAGER_RM_SENT') : '') + (problems.length ? ' · ' + t('MANAGER_RM_PROBLEM') + ' ' + problems.join('; ') : '')]);
      if (r.headless) rows.push(['MANAGER_ST_DISPLAY', t('DISPLAY_OUTPUT_NONE')]);
      $('rm-table').innerHTML = rows.map(function (x) { return '<tr><td>' + esc(t(x[0])) + '</td><td>' + esc(x[1]) + '</td></tr>'; }).join('');
      var subs = {};
      ((r.serve && r.serve.subscribers) || []).forEach(function (s) { subs[s.address.split(':')[0]] = s; });
      var box = $('rm-list');
      box.innerHTML = '';
      var seen = {};
      var items = (r.remotes || []).map(function (m) {
        seen[m.address] = true;
        var s = subs[m.address];
        return { name: m.name || m.id, address: m.address, release: m.release, screen: m.screen, since: m.since, page: m.page || '', frames: !!s, sent: s ? s.sent : 0 };
      });
      Object.keys(subs).forEach(function (ip) {
        if (!seen[ip]) items.push({ name: subs[ip].name || subs[ip].id, address: ip, release: subs[ip].release, screen: null, since: null, frames: true, sent: subs[ip].sent });
      });
      if (!items.length) { box.innerHTML = '<div class="empty">' + esc(t('MANAGER_RM_NONE')) + '</div>'; return; }
      items.forEach(function (m) {
        var el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = '<div class="grow"><div class="name">' + esc(m.name) + ' <span class="muted" style="font-weight:normal">' + esc(m.address) + (m.release ? ' · ' + esc(m.release) : '') + '</span></div>' +
          '<div class="muted" style="font-size:13px">' + (m.screen && m.screen[0] ? esc(t('MANAGER_RM_SCREEN')) + ' ' + m.screen[0] + 'x' + m.screen[1] + ' · ' : '') +
          esc(m.frames ? t('MANAGER_RM_SUBSCRIBED') + ' (' + m.sent + ')' : t('MANAGER_RM_NOT_SUBSCRIBED')) + (m.since ? ' · ' + esc(t('MANAGER_RM_SINCE')) + ' ' + esc(fmtDate(m.since)) : '') + '</div></div>' +
          // The remote's own settings page opens in this window: on the player's own display a new tab cannot be closed.
          (m.page ? '<a href="' + esc(m.page) + '" style="text-decoration:none"><button class="small">' + esc(t('MANAGER_RM_PAGE')) + '</button></a>' : '') +
          '<span class="badge ' + (m.frames ? 'green' : 'gray') + '">' + esc(m.frames ? 'LIVE' : 'IDLE') + '</span>';
        box.appendChild(el);
      });
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }
  $('btn-rm-refresh').onclick = loadRemotes;

  // ---- themes -----------------------------------------------------------
  function loadThemes() {
    return api('GET', '/api/themes').then(function (data) {
      state.themes = data.themes;
      state.active = data.active;
      renderThemes();
      loadCarDash();
      // The rendered previews come in behind the list; the cards are drawn again once they have.
      var loads = data.themes.filter(function (th) { return th.previews === 'fresh' || th.previews === 'stale'; })
        .map(function (th) { return loadPreviews(th.folder, false).catch(function () {}); });
      return Promise.all(loads).then(renderThemes);
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }
  function themeSize(th) { return th.width && th.height ? th.width + 'x' + th.height : ''; }
  function renderThemes() {
    var q = $('themes-search').value.trim().toLowerCase();
    var grid = $('themes-grid');
    grid.innerHTML = '';
    var shown = 0;
    (state.themes || []).forEach(function (th) {
      if (q && th.folder.toLowerCase().indexOf(q) === -1 && !th.meters.some(function (m) { return m.toLowerCase().indexOf(q) !== -1; })) return;
      shown++;
      var card = document.createElement('div');
      card.className = 'card' + (th.active ? ' active-theme' : '');
      var pv = state.previews[th.folder];
      var first = pv && pv.meters && pv.meters.length ? pv.meters[0] : null;
      var thumbHtml;
      if (first) {
        thumbHtml = '<img loading="lazy" src="' + esc(first.thumb) + '&v=' + encodeURIComponent(th.mtime) + '" alt="">';
      } else if (th.empty) {
        thumbHtml = '<div class="placeholder">' + esc(t('MANAGER_EMPTY_THEME')) + '</div>';
      } else if (th.previews === 'rendering' || th.previews === 'queued') {
        thumbHtml = '<div class="placeholder">' + esc(t('MANAGER_RENDERING')) + '</div>';
      } else {
        thumbHtml = '<div class="placeholder">' + esc(t('MANAGER_NO_PREVIEW')) + '</div>';
      }
      var badges = '';
      if (th.active) badges += '<span class="badge green">' + esc(t('THEME_GALLERY_ACTIVE')) + '</span> ';
      card.innerHTML =
        '<div class="thumb">' + thumbHtml + (badges ? '<div class="badge-wrap" style="position:absolute;top:8px;left:8px">' + badges + '</div>' : '') + '</div>' +
        '<div class="body">' +
          '<div class="title">' + esc(th.folder) + '</div>' +
          '<div class="meta">' +
            (themeSize(th) ? '<span>' + esc(themeSize(th)) + '</span>' : '') +
            '<span>' + th.meters.length + ' ' + esc(t('MANAGER_METERS_N')) + '</span>' +
            (th.spectrum ? '<span class="badge blue">' + esc(t('MANAGER_KIND_SPECTRUM')) + '</span>' : '') +
            (th.catalog ? '<span class="badge gray">' + esc(t('MANAGER_FROM_CATALOG')) + '</span>' : '') +
            '<span>' + esc(fmtBytes(th.bytes)) + '</span>' +
          '</div>' +
          '<div class="actions">' +
            (th.active ? '' : '<button class="small primary" data-act="activate">' + esc(t('MANAGER_ACTIVATE')) + '</button>') +
            '<button class="small" data-act="details">' + esc(t('MANAGER_DETAILS')) + '</button>' +
            (runningJob(th.folder, 'tailor') ? '<button class="small" disabled>' + esc(t('MANAGER_TAILOR_RUNNING')) + '</button>' : '<button class="small" data-act="tailor">' + esc(t('MANAGER_TAILOR_BTN')) + '</button>') +
            (runningJob(th.folder, 'package') ? '<button class="small" disabled>' + esc(t('MANAGER_PACKAGE_RUNNING')) + '</button>' : '<button class="small" data-act="package">' + esc(t('MANAGER_PACKAGE_BTN')) + '</button>') +
            '<button class="small danger" data-act="remove">' + esc(t('THEME_REMOVE_BTN')) + '</button>' +
          '</div>' +
        '</div>';
      card.querySelector('.thumb').onclick = function () { openTheme(th.folder); };
      card.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.act === 'activate') activateTheme(th.folder);
          else if (b.dataset.act === 'details') openTheme(th.folder);
          else if (b.dataset.act === 'remove') removeTheme(th.folder);
          else if (b.dataset.act === 'tailor') tailorTheme(th);
          else if (b.dataset.act === 'package') packageTheme(th.folder);
        };
      });
      grid.appendChild(card);
    });
    if (!shown) grid.innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc(t('MANAGER_NO_THEMES')) + '</div>';
  }
  $('themes-search').oninput = renderThemes;
  $('btn-themes-refresh').onclick = loadThemes;

  function loadPreviews(folder, rerender) {
    return api('GET', '/api/themes/' + encodeURIComponent(folder) + '/previews').then(function (data) {
      state.previews[folder] = data;
      var th = (state.themes || []).find(function (x) { return x.folder === folder; });
      if (th) th.previews = data.state;
      if (rerender !== false) renderThemes();
      if (state.currentTheme === folder) renderThemeModal();
      return data;
    });
  }

  function activateTheme(folder) {
    return api('POST', '/api/themes/' + encodeURIComponent(folder) + '/activate').then(function () {
      toast(t('MANAGER_ACTIVATED') + ' ' + folder);
      return loadThemes().then(function () { if (state.currentTheme === folder) openTheme(folder); });
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }

  // The cutter: a copy of the theme at another size, the active theme's
  // size offered first as the screen's.
  var tailorResolve = null;
  function tailorTheme(th) {
    var active = (state.themes || []).find(function (x) { return x.active; }) || th;
    $('tl-title').textContent = t('MANAGER_TAILOR_TITLE') + ' ' + th.folder;
    $('tl-help').textContent = t('MANAGER_TAILOR_DOC');
    $('tl-width').value = active.width || th.width || '';
    $('tl-height').value = active.height || th.height || '';
    $('tl-stretch').checked = false;
    $('tailor-modal').classList.add('open');
    tailorResolve = function (go) {
      $('tailor-modal').classList.remove('open');
      if (!go) return;
      var body = { width: parseInt($('tl-width').value, 10), height: parseInt($('tl-height').value, 10), stretch: $('tl-stretch').checked };
      api('POST', '/api/themes/' + encodeURIComponent(th.folder) + '/tailor', body).then(function (data) {
        toast(t('MANAGER_TAILOR_STARTED') + ' ' + data.job.name);
        watchJob(data.job);
      }).catch(function (e) { toast(errorText(e), 'error'); });
    };
  }
  $('tl-cancel').onclick = function () { if (tailorResolve) tailorResolve(false); };
  $('tl-ok').onclick = function () { if (tailorResolve) tailorResolve(true); };

  // The packager: the zip comes down when the job is done.
  function packageTheme(folder) {
    api('POST', '/api/themes/' + encodeURIComponent(folder) + '/package', { settle: 3 }).then(function (data) {
      toast(t('MANAGER_PACKAGE_STARTED') + ' ' + folder);
      watchJob(data.job);
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }

  function removeTheme(folder) {
    confirmDialog(t('THEME_REMOVE_CONFIRM_TITLE'), t('THEME_REMOVE_CONFIRM_MSG') + ' ' + folder, t('THEME_REMOVE_BTN')).then(function (ok) {
      if (!ok) return;
      return api('DELETE', '/api/themes/' + encodeURIComponent(folder)).then(function (data) {
        toast(data.switchedTo ? t('THEME_REMOVE_ACTIVE_RESET') + ' ' + data.switchedTo : t('THEME_REMOVE_DONE') + ' ' + folder);
        delete state.previews[folder];
        closeTheme();
        return loadThemes().then(function () { if (state.catalog) loadCatalog(false); });
      }).catch(function (e) { toast(errorText(e), 'error'); });
    });
  }

  function renderTheme(folder, force) {
    return api('POST', '/api/themes/' + encodeURIComponent(folder) + '/render', { force: !!force }).then(function (data) {
      state.previews[folder] = data;
      var th = (state.themes || []).find(function (x) { return x.folder === folder; });
      if (th) th.previews = data.state;
      renderThemes();
      if (state.currentTheme === folder) renderThemeModal();
      pollPreviews(folder);
    }).catch(function (e) { toast(errorText(e), 'error'); });
  }
  var previewPolls = {};
  function pollPreviews(folder) {
    if (previewPolls[folder]) return;
    previewPolls[folder] = setInterval(function () {
      loadPreviews(folder).then(function (data) {
        if (data.state !== 'rendering' && data.state !== 'queued') { clearInterval(previewPolls[folder]); delete previewPolls[folder]; }
      }).catch(function () { clearInterval(previewPolls[folder]); delete previewPolls[folder]; });
    }, 2000);
  }
  $('btn-render-all').onclick = function () {
    (state.themes || []).forEach(function (th) {
      if (!th.empty && th.previews !== 'fresh' && th.previews !== 'rendering' && th.previews !== 'queued') renderTheme(th.folder, false);
    });
  };

  // Theme details.
  function openTheme(folder) {
    state.currentTheme = folder;
    $('theme-modal').classList.add('open');
    renderThemeModal();
    var th = (state.themes || []).find(function (x) { return x.folder === folder; });
    if (th && th.active) loadMeterSelection();
    if (th && !th.empty && (!state.previews[folder] || state.previews[folder].state !== 'fresh')) {
      if (th.previews === 'rendering' || th.previews === 'queued') pollPreviews(folder);
      else renderTheme(folder, false);
    }
  }
  function closeTheme() { state.currentTheme = null; $('theme-modal').classList.remove('open'); }
  $('tm-close').onclick = closeTheme;
  $('theme-modal').onclick = function (e) { if (e.target === $('theme-modal')) closeTheme(); };
  function renderThemeModal() {
    var folder = state.currentTheme;
    var th = (state.themes || []).find(function (x) { return x.folder === folder; });
    if (!th) return;
    $('tm-title').textContent = th.folder;
    $('tm-meta').textContent = [themeSize(th), th.meters.length + ' ' + t('MANAGER_METERS_N'), th.spectrum ? t('MANAGER_HAS_SPECTRUM') : '', fmtBytes(th.bytes), th.catalog ? t('MANAGER_FROM_CATALOG') + ': ' + th.catalog : ''].filter(Boolean).join(' · ');
    $('tm-activate').classList.toggle('hidden', !!th.active);
    var pv = state.previews[folder];
    var box = $('tm-previews');
    box.innerHTML = '';
    if (pv && pv.meters && pv.meters.length) {
      pv.meters.forEach(function (m) {
        var el = document.createElement('div');
        el.className = 'm';
        el.innerHTML = '<img loading="lazy" src="' + esc(m.thumb) + '&v=' + encodeURIComponent(th.mtime) + '" alt=""><div>' + esc(m.meter) + '</div>';
        el.onclick = function () { lightbox(m.url + '?v=' + encodeURIComponent(th.mtime)); };
        box.appendChild(el);
      });
      if (pv.state === 'rendering' || pv.state === 'queued') box.insertAdjacentHTML('afterbegin', '<div class="help" style="grid-column:1/-1">' + esc(t('MANAGER_RENDERING')) + '</div>');
    } else {
      box.innerHTML = '<div class="help" style="grid-column:1/-1">' + esc(th.empty ? t('MANAGER_EMPTY_THEME') : (pv && (pv.state === 'rendering' || pv.state === 'queued') ? t('MANAGER_RENDERING') : t('MANAGER_NO_PREVIEW'))) + '</div>';
    }
    $('tm-render').disabled = !!th.empty || (pv && (pv.state === 'rendering' || pv.state === 'queued'));
    $('tm-rotation').classList.toggle('hidden', !th.active);
    if (th.active && state.meterSel) renderRotation();
  }
  $('tm-activate').onclick = function () { activateTheme(state.currentTheme); };
  $('tm-render').onclick = function () { renderTheme(state.currentTheme, true); };
  $('tm-remove').onclick = function () { removeTheme(state.currentTheme); };

  // Rotation of the active theme.
  function loadMeterSelection() {
    return api('GET', '/api/meter').then(function (data) { state.meterSel = data; renderRotation(); }).catch(function (e) { toast(errorText(e), 'error'); });
  }
  function renderRotation() {
    var sel = state.meterSel;
    if (!sel) return;
    $('tm-mode').value = sel.mode;
    $('tm-change').value = sel.onTitle ? 'title' : 'interval';
    $('tm-interval').value = sel.interval;
    var box = $('tm-names');
    box.innerHTML = '';
    sel.available.forEach(function (name) {
      var id = 'tmn-' + name.replace(/[^a-z0-9]/gi, '_');
      var lab = document.createElement('label');
      lab.className = 'switch';
      var type = $('tm-mode').value === 'single' ? 'radio' : 'checkbox';
      lab.innerHTML = '<input type="' + type + '" name="tmn" value="' + esc(name) + '" id="' + id + '"' + (sel.names.indexOf(name) !== -1 ? ' checked' : '') + '><span>' + esc(name) + '</span>';
      box.appendChild(lab);
    });
    updateRotationVisibility();
  }
  function updateRotationVisibility() {
    var mode = $('tm-mode').value;
    $('tm-names').parentElement.classList.toggle('hidden', mode === 'random');
    $('tm-names').querySelectorAll('input').forEach(function (i) { i.type = mode === 'single' ? 'radio' : 'checkbox'; });
    $('tm-change').parentElement.classList.toggle('hidden', mode === 'single');
    $('tm-interval').parentElement.classList.toggle('hidden', mode === 'single' || $('tm-change').value === 'title');
  }
  $('tm-mode').onchange = updateRotationVisibility;
  $('tm-change').onchange = updateRotationVisibility;
  $('tm-save').onclick = function () {
    var mode = $('tm-mode').value;
    var names = [];
    $('tm-names').querySelectorAll('input:checked').forEach(function (i) { names.push(i.value); });
    api('POST', '/api/meter', { mode: mode, names: names, onTitle: $('tm-change').value === 'title', interval: parseInt($('tm-interval').value, 10) }).then(function (data) {
      state.meterSel = data;
      renderRotation();
      toast(t('MANAGER_SAVED'));
    }).catch(function (e) { toast(errorText(e), 'error'); });
  };

  // Upload.
  $('btn-upload').onclick = function () { $('upload-file').click(); };
  $('upload-file').onchange = function () {
    var file = $('upload-file').files[0];
    if (!file) return;
    $('upload-file').value = '';
    api('POST', '/api/upload?name=' + encodeURIComponent(file.name), file, true).then(function (data) {
      watchJob(data.job);
    }).catch(function (e) { toast(errorText(e), 'error'); });
  };

  // Rules and preserve.
  function loadSettings() {
    return api('GET', '/api/settings').then(function (s) {
      $('rules-input').value = s.themeTagRules || '';
      $('preserve-input').checked = !!s.doNotDeleteThemes;
    }).catch(function () {});
  }
  $('btn-rules-save').onclick = function () {
    api('POST', '/api/settings', { themeTagRules: $('rules-input').value, doNotDeleteThemes: $('preserve-input').checked }).then(function () {
      toast(t('MANAGER_SAVED'));
    }).catch(function (e) { toast(errorText(e), 'error'); });
  };

  // ---- jobs -------------------------------------------------------------
  function watchJob(job) {
    state.jobs[job.id] = job;
    renderJobs();
    renderThemes();
    if (!jobTimer) jobTimer = setInterval(pollJobs, 1000);
  }
  var jobTimer = null;
  function pollJobs() {
    var active = Object.keys(state.jobs).filter(function (id) { var j = state.jobs[id]; return j.state !== 'done' && j.state !== 'failed'; });
    if (!active.length) { clearInterval(jobTimer); jobTimer = null; return; }
    active.forEach(function (id) {
      api('GET', '/api/jobs/' + id).then(function (data) {
        var before = state.jobs[id].state;
        state.jobs[id] = data.job;
        renderJobs();
        if (before !== data.job.state && (data.job.kind === 'tailor' || data.job.kind === 'package')) renderThemes();
        if (before !== data.job.state && (data.job.state === 'done' || data.job.state === 'failed' || data.job.state === 'rendering')) {
          if (data.job.state === 'failed') toast(t('MANAGER_JOB_FAILED') + ' ' + data.job.name + ': ' + errorText(data.job.error ? { code: data.job.error.error, message: data.job.error.message } : null), 'error');
          if (data.job.kind === 'package' && data.job.state === 'done') {
            toast(t('MANAGER_PACKAGE_DONE') + ' ' + data.job.name);
            window.location.href = '/api/jobs/' + id + '/file';
          } else if (data.job.state === 'done' || data.job.state === 'rendering') {
            if (before !== 'rendering' && before !== 'done') {
              toast(t('MANAGER_JOB_DONE') + ' ' + data.job.folders.map(function (f) { return f.folder; }).join(', '));
              loadThemes().then(function () { data.job.folders.forEach(function (f) { if (f.install === 'templates') pollPreviews(f.folder); }); });
              if (state.catalog) loadCatalog(false);
            }
          }
          // A package's row stays with its download; the others go after a moment.
          if (data.job.state === 'failed' || (data.job.state === 'done' && data.job.kind !== 'package')) setTimeout(function () { delete state.jobs[id]; renderJobs(); renderThemes(); }, 8000);
        }
      }).catch(function () {});
    });

  function renderJobs() {

    var settings = t('MANAGER_SCREEN_ROTATION').toLowerCase() + ' ' + (sc.rotation || 0) + ' · ' + t('MANAGER_SCREEN_POINTER').toLowerCase() + ' ' + pointer;
    var turns = [tc.swap && t('MANAGER_TOUCHMAP_SWAP'), tc.flipX && t('MANAGER_TOUCHMAP_FLIP_X'), tc.flipY && t('MANAGER_TOUCHMAP_FLIP_Y')].filter(Boolean);
    var calibration = calibrationText(tc);
    var mapping = t('MANAGER_TOUCHMAP_' + String(tc.mapping || 'auto').toUpperCase()) +
      (tc.mapping === 'overrides' && turns.length ? ': ' + turns.join(', ').toLowerCase() : '') + (calibration ? ' · ' + calibration : '');
    var panels = (p.connectors || []).map(function (c) {
      if (c.status !== 'connected') return c.name + ': ' + t('MANAGER_SCREEN_DISCONNECTED');
      var size = c.native ? c.native.width + '×' + c.native.height : '';
      return c.name + ': ' + t('MANAGER_SCREEN_CONNECTED') + (size ? ', ' + size : '') + (c.portrait ? ', ' + t('MANAGER_SCREEN_PORTRAIT') : '');
    });
    var inputs = p.inputs || { touch: [], mice: [], keyboards: [], remotes: [] };
    var names = function (list) { return list && list.length ? list.map(function (dev) { return dev.name + (dev.event ? ' (' + String(dev.event).replace('/dev/input/', '') + ')' : ''); }).join(', ') : none; };
    var found = [t('MANAGER_SCREEN_TOUCH') + ': ' + names(inputs.touch), t('MANAGER_SCREEN_MICE') + ': ' + names(inputs.mice), t('MANAGER_SCREEN_KEYBOARDS') + ': ' + names(inputs.keyboards)];
    if (inputs.remotes && inputs.remotes.length) found.push(t('MANAGER_SCREEN_REMOTES') + ': ' + names(inputs.remotes));
    var lights = (p.backlights || []).map(function (b) { return b.name + ': ' + b.brightness + ' / ' + b.max; });
    var rows = [
      ['MANAGER_ST_DRAWN_ON', drawn + ' · ' + t(sc.free ? 'MANAGER_ST_SCREEN_GLASS' : 'MANAGER_ST_SCREEN_KIOSK')],
      ['MANAGER_ST_KIOSK', kiosk],
      ['MANAGER_ST_SCREEN_SETTINGS', settings],
      ['MANAGER_ST_TOUCH_MAP', mapping],
      ['MANAGER_SCREEN_PANELS', panels.length ? panels.join(' · ') : none],
      ['MANAGER_ST_INPUTS', found.join(' · ')],
      ['MANAGER_SCREEN_BACKLIGHT', lights.length ? lights.join(' · ') : none]
    ];
    return rows;
  }
  function renderTouch(tc) {
    if (!tc) return;
    $('touch-map').value = tc.mapping || 'auto';
    $('touch-swap').checked = !!tc.swap; $('touch-flip-x').checked = !!tc.flipX; $('touch-flip-y').checked = !!tc.flipY;
    var overrides = $('touch-map').value === 'overrides';
    ['touch-swap', 'touch-flip-x', 'touch-flip-y'].forEach(function (id) { $(id).disabled = !overrides; });
    var c = tc.calibration || { state: 'none' };
    $('touch-map-state').textContent = calibrationText(tc);
    if (c.state === 'waiting') { if (!state.touchPoll) state.touchPoll = setTimeout(function () { state.touchPoll = null; api('GET', '/api/screen').then(function (sc) { renderTouch(sc.touch); }).catch(function () {}); }, 2000); }
  }
  $('touch-map').onchange = function () { var overrides = $('touch-map').value === 'overrides'; ['touch-swap', 'touch-flip-x', 'touch-flip-y'].forEach(function (id) { $(id).disabled = !overrides; }); };
  $('btn-touch-map-apply').onclick = function () {
    api('POST', '/api/screen/touch', { mapping: $('touch-map').value, swap: $('touch-swap').checked, flipX: $('touch-flip-x').checked, flipY: $('touch-flip-y').checked }).then(function (tc) { renderTouch(tc); toast(t('MANAGER_SAVED')); }).catch(function (e) { toast(errorText(e), 'error'); });
  };
  $('btn-touch-calibrate').onclick = function () {
    api('POST', '/api/screen/calibrate', {}).then(function (r) { renderTouch({ mapping: $('touch-map').value, calibration: r.calibration }); toast(t('MANAGER_TOUCHMAP_STARTED')); }).catch(function (e) { toast(errorText(e), 'error'); });
  };
  $('btn-screen-details').onclick = function () { showView('status'); };
  $('btn-screen-apply').onclick = function () {
    api('POST', '/api/screen', { rotation: parseInt($('screen-rotation').value, 10), pointer: $('screen-pointer').value }).then(function (sc) { renderScreen(sc); toast(t('MANAGER_SAVED')); }).catch(function (e) { toast(errorText(e), 'error'); });
  };
  $('btn-share-apply').onclick = function () {
    api('POST', '/api/sharing', { shared: $('share-on').checked }).then(function (sh) { $('share-on').checked = !!sh.shared; toast(t('MANAGER_SAVED')); }).catch(function (e) { toast(errorText(e), 'error'); });
  };
  function loadPerformance() {
    return api('GET', '/api/performance').then(renderPerformance).catch(function (e) { toast(errorText(e), 'error'); });
  }
  function renderPerformance(p) {
    state.performance = p;
    var names = ['auto', 'full', 'standard', 'light', 'minimal', 'custom'];
    $('perf-profile').innerHTML = names.map(function (n) {
      var label = t('MANAGER_PERF_' + n.toUpperCase()) + (n === 'auto' ? ' (' + t('MANAGER_PERF_' + p.auto.toUpperCase()) + ')' : '');
      return '<option value="' + n + '"' + (p.profile === n ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
    $('perf-board').textContent = t('MANAGER_PERF_BOARD') + ' ' + (p.board.model || p.board.arch || '?') + ' · ' + p.board.cores + ' ' + t('MANAGER_PERF_CORES') + ' · ' + t('MANAGER_PERF_AUTO_IS') + ' ' + t('MANAGER_PERF_' + p.auto.toUpperCase());
    var v = p.values;
    $('perf-governor').checked = p.governor !== false;
    var lowered = p.showing && p.showing.rate && p.showing.rate < v.frameRate ? ' · ' + t('MANAGER_ST_GOVERNED') + ' ' + p.showing.rate : '';
    $('perf-values').innerHTML = '<table class="kv"><tr><td>' + esc(t('FRAME_RATE')) + '</td><td>' + v.frameRate + esc(lowered) + '</td></tr><tr><td>' + esc(t('ROTATION_QUALITY')) + '</td><td>' + esc(v.rotationQuality) + ' · ' + v.rotationFps + ' fps</td></tr><tr><td>' + esc(t('TRANSITION_TYPE')) + '</td><td>' + esc(v.transitions ? t('MANAGER_ST_YES') : t('MANAGER_ST_NO')) + '</td></tr><tr><td>' + esc(t('MANAGER_PERF_THESE_ARE')) + '</td><td>' + esc(t('MANAGER_PERF_' + p.valuesProfile.toUpperCase())) + '</td></tr></table>';
  }
  $('btn-perf-apply').onclick = function () {
    api('POST', '/api/performance', { profile: $('perf-profile').value, governor: $('perf-governor').checked }).then(function (p) { renderPerformance(p); toast(p.changed ? t('MANAGER_PERF_APPLIED') : t('MANAGER_PERF_UNCHANGED')); loadStatus(); }).catch(function (e) { toast(errorText(e), 'error'); });
  };

  // ---- logging ------------------------------------------------------------
  function loadLogging() {
    return api('GET', '/api/logging').then(renderLogging).catch(function (e) { toast(errorText(e), 'error'); });
  }
  function renderLogging(l) {
    state.logging = l;
    $('log-level').innerHTML = l.levels.map(function (n) { return '<option value="' + n + '"' + (l.level === n ? ' selected' : '') + '>' + esc(t('MANAGER_LOG_' + n.toUpperCase())) + '</option>'; }).join('');
    $('log-targets').innerHTML = l.targetsAvailable.map(function (n) { return '<label class="switch"><input type="checkbox" name="log-target" value="' + n + '"' + (l.targets.indexOf(n) !== -1 ? ' checked' : '') + '><span>' + esc(t('MANAGER_LOG_T_' + n.toUpperCase())) + '</span></label>'; }).join('');
    logTargetsVisible();
  }
  function logTargetsVisible() {
    var fine = $('log-level').value === 'verbose' || $('log-level').value === 'trace';
    $('log-targets-block').classList.toggle('hidden', !fine);
  }
  $('log-level').onchange = logTargetsVisible;
  $('btn-log-apply').onclick = function () {
    var targets = Array.prototype.map.call(document.querySelectorAll('input[name=log-target]:checked'), function (i) { return i.value; });
    api('POST', '/api/logging', { level: $('log-level').value, targets: targets }).then(function (l) { renderLogging(l); toast(t('MANAGER_LOG_APPLIED')); }).catch(function (e) { toast(errorText(e), 'error'); });
  };
  $('btn-log-show').onclick = function () {
    var pre = $('log-lines');
    if (!pre.classList.contains('hidden')) { pre.classList.add('hidden'); return; }
    pre.textContent = t('MANAGER_LOADING'); pre.classList.remove('hidden');
    api('GET', '/api/logs?lines=300').then(function (d) { pre.textContent = d.lines.length ? d.lines.join('\n') : t('MANAGER_LOG_EMPTY'); pre.scrollTop = pre.scrollHeight; }).catch(function (e) { pre.textContent = errorText(e); });
  };

  // ---- upgrading Glass ---------------------------------------------------
  function loadUpdate(force) {
    var call = force ? api('POST', '/api/update/check') : api('GET', '/api/update');
    $('upd-body').textContent = t('MANAGER_LOADING');
    return call.then(renderUpdate).catch(function (e) {
      if (e.data && e.data.current) renderUpdate(e.data);
      else $('upd-body').textContent = errorText(e);
    });
  }
  // The header says when a newer release is known, wherever the page is.
  function updateBadge(u) {
    var badge = $('upd-badge');
    badge.classList.toggle('hidden', !(u && u.available));
    if (u && u.available) badge.textContent = t('MANAGER_UPD_BADGE') + ' ' + u.latest.version;
  }
  $('upd-badge').onclick = function () { showView('system'); };
  function renderUpdate(u) {
    state.update = u;
    updateBadge(u);
    var lines = [];
    lines.push('<div>' + esc(t('MANAGER_UPD_CURRENT')) + ' <b>' + esc(u.current) + '</b></div>');
    if (u.latest) {
      lines.push('<div>' + esc(t('MANAGER_UPD_LATEST')) + ' <b>' + esc(u.latest.version) + '</b>' + (u.latest.publishedAt ? ' <span class="muted">(' + esc(fmtDate(u.latest.publishedAt)) + ')</span>' : '') +
        (u.available ? ' <span class="badge orange">' + esc(t('MANAGER_STATE_UPDATE')) + '</span>' : ' <span class="badge green">' + esc(t('MANAGER_UPD_UPTODATE')) + '</span>') + '</div>');
    }
    if (u.checkedAt) lines.push('<div class="help">' + esc(t('MANAGER_CATALOG_FETCHED')) + ' ' + esc(fmtDate(u.checkedAt)) + '</div>');
    if (u.error) lines.push('<div class="help">' + esc(t('MANAGER_UPD_CHECK_FAILED')) + ' ' + esc(u.error.message || u.error.error) + '</div>');
    if (u.last && u.last.phase === 'done') lines.push('<div class="help">' + esc(u.last.ok ? t('MANAGER_UPD_LAST') : t('MANAGER_UPD_LAST_FAILED')) + ' ' + esc(u.last.from) + ' to ' + esc(u.last.to) + ' (' + esc(fmtDate(u.last.endedAt || u.last.at)) + ')</div>');
    if (u.last && u.last.phase === 'failed') lines.push('<div class="help">' + esc(t('MANAGER_UPD_LAST_FAILED')) + ' ' + esc(u.last.from) + ' to ' + esc(u.last.to) + ': ' + esc(u.last.error || '') + '</div>');
    lines.push('<div class="help">' + esc(u.previous ? t('MANAGER_UPD_PREVIOUS') + ' ' + u.previous.version + ' (' + fmtBytes(u.previous.bytes) + ')' : t('MANAGER_UPD_NONE')) + '</div>');
    $('upd-body').innerHTML = lines.join('');
    $('btn-upd-install').classList.toggle('hidden', !u.available);
    $('btn-upd-install').textContent = u.available ? t('MANAGER_UPD_UPGRADE') + ' ' + u.latest.version : '';
    $('btn-upd-rollback').classList.toggle('hidden', !u.previous);
    $('btn-upd-rollback').textContent = u.previous ? t('MANAGER_UPD_ROLLBACK') + ' ' + u.previous.version : '';
    $('btn-upd-notes').classList.toggle('hidden', !(u.latest && u.latest.notes));
    $('upd-notes').textContent = u.latest && u.latest.notes ? u.latest.notes : '';
  }
  $('btn-upd-check').onclick = function () { loadUpdate(true); };
  $('btn-upd-notes').onclick = function () { $('upd-notes').classList.toggle('hidden'); };
  $('btn-upd-install').onclick = function () {
    var u = state.update;
    if (!u || !u.available) return;
    confirmDialog(t('MANAGER_UPD_CONFIRM_TITLE') + ' ' + u.latest.version, t('MANAGER_UPD_CONFIRM_MSG'), t('MANAGER_UPD_UPGRADE') + ' ' + u.latest.version).then(function (ok) {
      if (!ok) return;
      api('POST', '/api/update/install').then(function (data) { followUpgrade(data.job); }).catch(function (e) { toast(errorText(e), 'error'); });
    });
  };
  $('btn-upd-rollback').onclick = function () {
    var u = state.update;
    if (!u || !u.previous) return;
    confirmDialog(t('MANAGER_UPD_ROLLBACK') + ' ' + u.previous.version, t('MANAGER_UPD_ROLLBACK_MSG'), t('MANAGER_UPD_ROLLBACK') + ' ' + u.previous.version).then(function (ok) {
      if (!ok) return;
      api('POST', '/api/update/rollback').then(function (data) { followUpgrade(data.job); }).catch(function (e) { toast(errorText(e), 'error'); });
    });
  };
  // The job runs until the backend restarts; then the page waits for the target version to answer.
  function followUpgrade(job) {
    var target = job.target;
    $('btn-upd-install').disabled = true;
    $('btn-upd-rollback').disabled = true;
    var draw = function (j, extra) {
      var pct = j.progress && j.progress.total ? Math.round(j.progress.done * 100 / j.progress.total) : 0;
      var label = { queued: 'MANAGER_JOB_QUEUED', downloading: 'MANAGER_JOB_DOWNLOADING', verifying: 'MANAGER_JOB_CHECKING', 'backing-up': 'MANAGER_JOB_BACKING_UP', applying: 'MANAGER_JOB_APPLYING', restarting: 'MANAGER_UPD_RESTARTING', failed: 'MANAGER_JOB_FAILED' }[j.state] || j.state;
      $('jobs-update').innerHTML = '<div class="job"><b>' + esc(j.name) + '</b> · ' + esc(t(label)) + (extra ? ' · ' + esc(extra) : '') +
        (j.state === 'downloading' || j.state === 'backing-up' ? ' ' + pct + '%<div class="progress"><div style="width:' + pct + '%"></div></div>' : '') +
        (j.state === 'failed' && j.error ? ' <span class="muted">' + esc(errorText({ code: j.error.error, message: j.error.message })) + '</span>' : '') + '</div>';
    };
    draw(job);
    var restarting = false;
    var started = Date.now();
    var tick = function () {
      if (!restarting) {
        api('GET', '/api/jobs/' + job.id).then(function (data) {
          draw(data.job);
          if (data.job.state === 'failed') { $('btn-upd-install').disabled = false; $('btn-upd-rollback').disabled = false; loadUpdate(false); return; }
          if (data.job.state === 'restarting') { restarting = true; started = Date.now(); }
          setTimeout(tick, 1000);
        }).catch(function () {
          // The plugin manager stopped the plugin, and this page's server with it.
          restarting = true;
          started = Date.now();
          draw({ name: job.name, state: 'restarting' });
          setTimeout(tick, 3000);
        });
        return;
      }
      api('GET', '/api/status').then(function (s) {
        if (s.version === target) {
          draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_DONE') + ' ' + s.version);
          toast(t('MANAGER_UPD_DONE') + ' ' + s.version);
          setTimeout(function () { window.location.reload(); }, 2500);
          return;
        }
        draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_WAITING'));
        if (Date.now() - started > 240000) { draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_NOT_BACK')); return; }
        setTimeout(tick, 3000);
      }).catch(function () {
        draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_WAITING'));
        if (Date.now() - started > 240000) { draw({ name: job.name, state: 'restarting' }, t('MANAGER_UPD_NOT_BACK')); return; }
        setTimeout(tick, 3000);
      });
    };
    setTimeout(tick, 1000);
  }

  // ---- the kiosk's keyboard ----------------------------------------------
  // Inside Volumio's page on the player's own display, text is typed on
  // Volumio's on-screen keyboard: the page tells the parent when an input
  // takes focus and takes the keystrokes the parent relays back.
  if (window.parent !== window) {
    var kbInput = null;
    var kbRelay = false;
    var kbHide = null;
    var kbStyle = document.createElement('style');
    kbStyle.textContent = '.volumio-keyboard-focused { outline: 2px solid var(--accent) !important; outline-offset: -2px !important; }';
    document.head.appendChild(kbStyle);
    var kbTell = function (action) {
      try { window.parent.postMessage({ type: 'volumio-input-focus', action: action }, '*'); } catch (e) {}
    };
    document.addEventListener('focusin', function (e) {
      if (!e.target.matches('input[type=text], input[type=search], input[type=number], textarea')) return;
      kbInput = e.target;
      kbRelay = true;
      e.target.classList.add('volumio-keyboard-focused');
      if (kbHide) { clearTimeout(kbHide); kbHide = null; }
      kbTell('show-keyboard');
    }, true);
    document.addEventListener('focusout', function (e) {
      if (!e.target.matches('input, textarea') || kbRelay) return;
      kbHide = setTimeout(function () {
        kbInput = null;
        e.target.classList.remove('volumio-keyboard-focused');
        kbTell('hide-keyboard');
        kbHide = null;
      }, 300);
    }, true);
    document.addEventListener('click', function (e) {
      if (!kbRelay || e.target.matches('input, textarea')) return;
      kbRelay = false;
      if (kbInput) { kbInput.classList.remove('volumio-keyboard-focused'); kbInput = null; }
      kbTell('hide-keyboard');
    }, true);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'volumio-keystroke' || e.data.action !== 'input' || !kbInput) return;
      var input = kbInput;
      var at = input.selectionStart || 0;
      var text = input.value || '';
      var typed = String(e.data.value || '');
      input.value = text.substring(0, at) + typed + text.substring(at);
      try { input.setSelectionRange(at + typed.length, at + typed.length); } catch (err) {}
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.classList.add('volumio-keyboard-focused');
    }, false);
  }

  // ---- start ------------------------------------------------------------
  if (window.parent === window) {
    $('btn-close').classList.remove('hidden');
    $('btn-close').onclick = function () {
      window.close();
      setTimeout(function () { if (!window.closed) { if (window.history.length > 1) window.history.back(); else window.location.href = '/'; } }, 100);
    };
  }
  api('GET', '/api/i18n').then(function (data) { S = data.strings || {}; }).catch(function () {}).then(function () {
    applyStrings();
    if (window.GlassFace) GlassFace.init({ t: t, version: function () { return state.status && state.status.version ? state.status.version : ''; } });
    loadThemes().then(loadSettings);
    loadStatus();
    api('GET', '/api/update').then(updateBadge).catch(function () {});
    // The tab: from the address (#catalog), else the one last looked at.
    var saved = (window.location.hash || '').slice(1);
    if (!saved) { try { saved = localStorage.getItem('glass-manager-tab'); } catch (e) {} }
    if (saved && saved !== 'themes' && $('view-' + saved)) showView(saved);
  });
  window.addEventListener('hashchange', function () {
    var name = (window.location.hash || '').slice(1);
    if (name && $('view-' + name)) showView(name);
  });
})();
</script>
</body>
</html>
